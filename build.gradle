plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.13'
    id 'java'
}

// -----------------------------------------------------------------------------
// Band label: what Minecraft versions this jar RUNS ON, stamped into its name.
//
// WHY THIS EXISTS. The jar used to be `mcmmo-2.2.050-build.28.jar` — no Minecraft version anywhere
// in the filename. The MC version lived only in the git tag and inside fabric.mod.json, so every
// upload needed a hand-rename to say what it was for, and the branches' jars differed only by a
// `build.<N>` that is GITHUB_RUN_NUMBER: repo-global rather than per-branch, so identical mod code got
// a different number on every branch. Numbers that look comparable and are not.
//
// A band covers a RANGE of versions with ONE jar (ruling R-a), so the label is a range, not a point:
//     1 version   -> +mc1.21.5
//     N versions  -> +mc1.21.6-1.21.8      (endpoints, both written out in full)
//
// Ordering note: this is SemVer build metadata, so it sorts after any `-SNAPSHOT` pre-release tag —
// `2.2.050-SNAPSHOT+mc1.21.6-1.21.8` is correct, not accidental. Every form the five bands can
// produce was checked against fabric-loader 0.19.3's own parser before this landed, and
// BandVersionLabelTest keeps checking it.
//
// Resolved HERE, at configuration time, and captured into a local. Reading `project` from inside a
// task's execution-time closure is what the configuration cache rejects — see the same scar on
// processResources below.
//
// findProperty, not project.<name>: a bare dereference of a missing property throws
// MissingPropertyException naming only the property, which is a confusing failure on a band branch
// that took this logic in a cherry-pick without gradle.properties. Fail with the fix instead.
def declaredBandVersions = project.findProperty('supported_minecraft_versions')
if (declaredBandVersions == null) {
    throw new GradleException(
            'gradle.properties is missing supported_minecraft_versions. Every branch must declare the '
                    + "Minecraft versions ITS OWN band's jar runs on, ascending and comma-separated "
                    + '(e.g. supported_minecraft_versions=1.21.6,1.21.7,1.21.8). The value is per-band '
                    + 'and must not be copied from another branch.')
}
def bandVersions = declaredBandVersions.toString().split(',')*.trim().findAll { it }
if (bandVersions.isEmpty()) {
    throw new GradleException(
            'supported_minecraft_versions is empty in gradle.properties. It must list every Minecraft '
                    + "version this band's jar runs on, ascending and comma-separated.")
}
def bandLabel = bandVersions.size() == 1
        ? "mc${bandVersions.first()}"
        : "mc${bandVersions.first()}-${bandVersions.last()}"

version = "${project.mod_version}+${bandLabel}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories here as ported code needs them. Fabric/MC come from Loom.
    mavenCentral() // JUnit (and future plain-Java test/util deps)

    // Optional client-integration mods (ModMenu, Cloth Config). Dev classpath only — see below.
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // NO `mappings` line. From 26.1 Minecraft ships unobfuscated, so Loom consumes it directly and
    // there is no mappings artifact to name -- yarn does not publish for 26.x at all (meta returns
    // []), and officialMojangMappings() is equally meaningless here. See TODO.md section 27.
    // Nothing needs remapping either, so these are plain `implementation`, not `modImplementation`.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // YAML config backend. mcMMO's configs are .yml (ported from Bukkit's YamlConfiguration);
    // snakeyaml replaces that engine. `include` nests it in the built jar (Fabric Jar-in-Jar)
    // so the mod ships it at runtime; `implementation` puts it on the compile/test classpath.
    implementation "org.yaml:snakeyaml:${project.snakeyaml_version}"
    include "org.yaml:snakeyaml:${project.snakeyaml_version}"

    // Optional client integrations: ModMenu (in-game config screen entry) + Cloth Config (the
    // editable options UI). Compile-only so the mod builds against their APIs, plus localRuntime so
    // `./gradlew runClient` loads them for in-game verification. NEVER bundled (no `include`): they
    // are the player's own choice to install. The `modmenu` entrypoint class is lazily loaded only
    // by ModMenu, and Cloth classes are referenced only behind a FabricLoader.isModLoaded("cloth-
    // config") guard, so the mod runs cleanly when either/both are absent.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    localRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        // cloth-config-fabric declares ModMenu as an optional dep; avoid pulling a second copy.
        exclude(group: 'net.fabricmc.fabric-api')
    }

    // Unit tests for MC-free code (the platform/ + event/ + skill-manager + config layers).
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Fabric Loader JUnit: runs the test task under Knot's classloader so Minecraft's access
    // wideners apply and SharedConstants.createGameVersion()/Bootstrap.initialize() can populate
    // the vanilla registries in a @BeforeAll. This is what makes the MC-typed glue that extracts a
    // registry-id path from an ItemStack/Block (ItemUtils/BlockUtils over MaterialMapStore) unit-
    // testable without an in-game client — plain JUnit fails with an IllegalAccessError because it
    // loads MC classes off the app classloader with the access wideners un-applied. Versioned to
    // the loader. See CONVERSION_TODO.md Phase 12.
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

    // Mockito for MC-free unit tests that need to stand in for the platform/ adapters (final
    // wrappers over net.minecraft types like ServerPlayerEntity, which can't be built without a
    // running server). Mockito 5's default inline mock maker mocks final classes directly.
    testImplementation "org.mockito:mockito-core:${project.mockito_version}"
}

// -----------------------------------------------------------------------------
// Incremental migration note.
//
// The legacy Bukkit/Spigot plugin lives under legacy/ (NOT a Gradle source dir)
// and is ported into src/main/java package-by-package per CONVERSION_TODO.md.
// `git mv` each file from legacy/ into src/ as it's converted. Standard Loom
// sourceSets apply here — no include filters.
// -----------------------------------------------------------------------------

processResources {
    // Captured at CONFIGURATION time. Dereferencing `project` inside the filesMatching closure
    // reads a Gradle script object at EXECUTION time, which the configuration cache rejects.
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand version: modVersion
    }
    // Legacy Bukkit resource files (plugin.yml, locale/**, *.yml configs) are
    // migrated in later phases; only fabric.mod.json + mixin configs matter now.
}

// The JDK level for THIS BAND, read from gradle.properties (ruling R-aa). It used to be hardcoded
// here four times over -- sourceCompatibility, targetCompatibility, the toolchain and
// options.release -- plus a fifth copy in release.yml, which stayed pinned to '21' on every branch
// including the one that needs 25. One declared value, every consumer reads it.
//
// ⚠️ REFUSES rather than defaulting. A default is worse than a crash here: compiling a band against
// the wrong release produces a jar that builds clean, tests clean, and fails at the player's
// launcher with UnsupportedClassVersionError. Nothing in this repo's gates would see it.
if (!project.hasProperty('java_version')) {
    throw new GradleException(
            "gradle.properties declares no java_version. It is a PER-BAND fact (26.x needs 25, the " +
            "1.21.x bands need 21) and both build.gradle and .github/workflows/release.yml read it " +
            "from there -- see ruling R-aa. Add java_version=<n> rather than reinstating a literal.")
}
def declaredJavaVersion = project.java_version.toString().trim()
if (!(declaredJavaVersion ==~ /\d+/)) {
    throw new GradleException(
            "gradle.properties has java_version='${declaredJavaVersion}', which is not a plain " +
            "integer. Write the major version alone, e.g. java_version=21.")
}
def javaLevel = declaredJavaVersion as Integer

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaLevel)
    targetCompatibility = JavaVersion.toVersion(javaLevel)
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaLevel)
    }
}

// javac stops reporting after 100 errors, notes it in one line, and exits with the SAME code as a
// run that reported everything. It does not fail -- it TRUNCATES, and the truncated number looks
// exactly as authoritative as the true one. That has turned a sizing into a guess twice:
//   * TODO.md 27  -- MC 26.2 read as a platform/-only break at the cap. Lifted: 2,639 errors across
//                    96 files, and the extra 2,539 decided the shape of the whole port.
//   * TODO.md 42  -- mc/26.1.2's test tree read 30 errors at the cap. Lifted: 61, across 8 files.
// -Xmaxwarns is deliberately NOT lifted: its cap has never misled anything here, and with
// -Xlint:deprecation below it would add thousands of lines to every band's build.
def compilerErrorCap = 10000

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = javaLevel
    it.options.compilerArgs << '-Xlint:deprecation'
    it.options.compilerArgs << '-Xmaxerrs' << compilerErrorCap.toString()
}

test {
    useJUnitPlatform()

    // Hand BandVersionLabelTest the version this build ACTUALLY computed, so the guard cross-checks
    // build.gradle's label logic instead of reimplementing it — a reimplementation would keep passing
    // if the real rule above broke. Captured into locals: reading `project` from a task's
    // execution-time closure is what the configuration cache rejects.
    // ⚠️ mod_version is handed over SEPARATELY from gradle.properties' text, because the release path
    // overrides it: release.yml builds with -Pmod_version=<base minus -SNAPSHOT>. A guard that rebuilt
    // the expected string from the FILE therefore compared 2.2.050-SNAPSHOT+mc<band> against the
    // 2.2.050+mc<band> the build really produced, and failed on the release path ONLY — green on every
    // developer machine, red on all four bands' Build step, which is how it shipped to five branches
    // and blocked every release from 2026-08-13. Compare against what Gradle resolved; check the
    // file-vs-resolved relationship separately, where the override is a legal outcome.
    def resolvedVersion = project.version.toString()
    def resolvedBandVersions = bandVersions.join(',')
    def resolvedModVersion = project.mod_version.toString()
    def resolvedJavaLevel = javaLevel.toString()
    // TODO.md 44.2. Hands CompilerErrorCapTest the args compileJava ACTUALLY RESOLVED, realized here
    // at configuration time. Deliberately NOT the text of this file and NOT a re-derivation of
    // compilerErrorCap above: a guard that greps build.gradle for the string '-Xmaxerrs' passes while
    // the flag sits in a withType block that never matches compileJava, or after a later
    // `compilerArgs = [...]` assignment drops it. Both leave the string in the file. This reads the
    // task.
    def resolvedCompilerArgs = tasks.named('compileJava').get().options.compilerArgs.join(' ')
    systemProperty 'mcmmo.build.version', resolvedVersion
    systemProperty 'mcmmo.build.bandVersions', resolvedBandVersions
    systemProperty 'mcmmo.build.modVersion', resolvedModVersion
    // R-aa. Hands BandToolchainLevelTest the level THIS BUILD resolved, so the guard checks the
    // wiring rather than re-reading gradle.properties and agreeing with itself.
    systemProperty 'mcmmo.build.javaVersion', resolvedJavaLevel
    systemProperty 'mcmmo.build.compilerArgs', resolvedCompilerArgs
    inputs.property 'mcmmo.build.version', resolvedVersion
    inputs.property 'mcmmo.build.javaVersion', resolvedJavaLevel
    // Without this the guard is served a CACHED PASS after the args change -- the same defect
    // measured on 2026-08-18, where three real workflow mutations all scored "not caught" because
    // :test never re-ran.
    inputs.property 'mcmmo.build.compilerArgs', resolvedCompilerArgs

    // ⚠️⚠️ A FILE A GUARD TEST READS MUST BE DECLARED AS A TASK INPUT, or Gradle does not know the
    // test depends on it — and with org.gradle.caching=true it serves a CACHED PASS after that file
    // changes. BandVersionLabelTest asserts release.yml still refuses a stale mod_version; measured
    // 2026-08-18, three mutations of that workflow (deleting the refusal step, moving it below the
    // tag push, turning its exit 1 into exit 0) ALL scored "not caught" — not because the assertions
    // were wrong, but because :test never re-ran. A guard that cannot re-run is decoration.
    //
    // gradle.properties needs no entry here: mcmmo.build.version above already changes with it.
    // fabric.mod.json rides in on processResources' output, which is already a test input.
    inputs.file(rootProject.file('.github/workflows/release.yml'))
            .withPropertyName('releaseWorkflow')

    // The fabric-loader-junit tests call McTestRegistries.bootstrap() -> Bootstrap.initialize(),
    // which builds the whole vanilla registry set. Measured 2026-08-05: that @BeforeAll costs ~53s
    // and is CPU-bound, not GC-bound (512m and 3g time identically), so it is a fixed per-JVM cost.
    // The only way to beat it is to overlap it with real work in sibling JVMs.
    //
    // Forked PROCESSES, not JUnit in-JVM threads: mcMMO's main code is full of static singletons
    // (RankUtils is a plain HashMap, the config/mcMMO.p statics likewise), so sharing one JVM
    // across test threads would race. A process fork isolates them for free.
    maxParallelForks = 4
    maxHeapSize = '1g'
}

jar {
    // Same configuration-cache rule as processResources: resolve the name up front, not in the
    // rename closure, which runs at execution time.
    def archiveName = project.base.archivesName.get()
    from('LICENSE') {
        rename { "${it}_${archiveName}" }
    }
}
