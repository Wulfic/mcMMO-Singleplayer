# ---------------------------------------------------------------------------
# Band drift audit
#
# Ruling R-a chose branch-per-band. Its one unanswered objection is that a fix
# landing on master and being forgotten on a band branch produces NO error --
# the bug just comes back for that band's players, and the first report comes
# from a user. 11 of the last 12 issue fixes were version-agnostic logic bugs,
# so this is the common case, not the edge case.
#
# scripts/drift-audit.py is the mechanical answer to "did that fix reach every
# band?". This workflow runs it on a CLOCK rather than from memory, which is
# the whole point: a check you have to remember to run is a check that stops
# being run about three weeks after the person who wrote it moves on.
#
# It does NOT run per-push. Drift is a slow-moving condition and a per-push run
# would just fail every PR between "fix lands on master" and "fix is
# back-ported", training everyone to ignore it.
#
# ⚠️ fetch-depth: 0 is load-bearing. The audit walks merge-bases between master
# and every mc/** branch; a shallow clone has neither the history nor the
# remote refs, and the script would find zero band branches and exit 0 --
# indistinguishable from a clean audit. --require-bands is what turns that
# specific failure into a hard error, and it must be raised to the real band
# count as branches are cut -- see BAND_COUNT below and TODO step 8.x.9.
#
# ⚠️ This file only runs from the DEFAULT BRANCH. GitHub fires `schedule` from
# there and nowhere else, so the copies on the mc/** band branches are inert by
# construction -- they are kept byte-identical (R-i) so a freshly cut band
# inherits a correct file, not because they ever execute.
#
# THREE GUARDS RUN HERE, and they answer unrelated questions:
#
#   drift-audit.py            did a master fix REACH every band?
#   manifest-identity-audit.py  do two bands carry a byte-identical
#                             scripts/mc-surface.txt? That manifest is a
#                             PER-BAND generated fact, so identical bytes on
#                             two branches means at least one describes a
#                             Minecraft it does not ship -- and no per-branch
#                             check can ever see it, because on the branch it
#                             came from every record is true.
#   branch-file-identity-audit.py  the INVERSE (P19-1): does the shared
#                             governance/tooling layer -- AGENTS.md,
#                             .gitignore, .github/workflows/*.yml, scripts/**
#                             -- differ between branches? Those are ONE
#                             artifact every branch shares, not a per-band
#                             fact. AGENTS.md is the only tracked agent-facing
#                             doc in the repo, and two bands were found
#                             carrying a stub with no Destructive Actions
#                             section at all.
#   gradle-key-identity-audit.py  the key-level guard (R-w'): gradle.properties
#                             is the one shared file BOTH guards above must
#                             look away from, because mod_version has to be
#                             IDENTICAL on every branch while minecraft_version
#                             has to DIFFER. Neither a per-file identity check
#                             nor a per-band exclusion can express that, so the
#                             gap between them was exactly one key wide -- and
#                             a band left behind on mod_version silently STOPS
#                             RELEASING.
#
# ⚠️⚠️ Guards 2 and 3 hold OPPOSITE invariants over the same directory, and
# mc-surface.txt must appear in exactly one of them. If it ever lands in both,
# no state satisfies both guards and nothing can ship.
#
# ⚠️ Guard 4 holds BOTH invariants at once, over different KEYS of one file.
# That is not a contradiction and must not be "simplified" into either of the
# other two -- it is the only shape that fits gradle.properties.
#
# The last three live here only because this job already has the full history
# and every band ref, which is what any cross-branch check needs.
# ---------------------------------------------------------------------------
name: Band drift audit

on:
  schedule:
    # 07:00 UTC every Monday. Weekly, because the unit of drift is a release
    # cycle, not a commit.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      require_bands:
        description: 'Override the band floor (blank = use the declared BAND_COUNT)'
        required: false
        # Deliberately NO default. A literal here would be a second copy of the
        # number below, and the two would drift; blank is falsy, so the `||` in
        # the audit step falls through to the one declared value.

permissions:
  contents: read

env:
  # ⚠️ THE ONE PLACE THIS NUMBER LIVES. The count of mc/** band branches that
  # MUST be found, or the audit fails instead of reporting success.
  #
  # This exists because "found no bands" and "found no drift" print identically.
  # A shallow clone, a branch rename, or a failed fetch all yield zero branches
  # and a clean exit 0 -- the audit reports success precisely when it has become
  # incapable of detecting anything. The floor is the only thing that tells those
  # two states apart.
  #
  # ⚠️ It was `0` from the day this workflow was written, which made the weekly
  # run unable to fail: `github.event.inputs` is null on a `schedule` event, so
  # the fallback was what every scheduled run actually used. Nobody noticed,
  # because the file simultaneously stopped running at all -- R-g moved it off the
  # default branch, and GitHub only fires `schedule` from there. R-r brought it
  # back; this is the defect it came back with.
  #
  # ⚠️ Raise it when a band is cut (TODO 8.x.9). A stale value is UNDER-strict,
  # never over-strict -- with 5 bands and a floor of 4 the audit still passes -- so
  # nothing will ever remind you. That is the trade: it cannot false-alarm, and it
  # cannot nag.
  #
  # ⚠️ That trade has now been paid once, so treat it as measured rather than
  # theoretical: mc/1.21.1 was cut, gated, pushed AND RELEASED with this still at
  # '5' against six bands on origin. Nothing went red, because nothing can.
  #
  # Counts mc/** branches only, master excluded -- the same meaning for all three
  # scripts below. Six bands on origin as of 2026-08-19: 1.21.1, 1.21.3, 1.21.4,
  # 1.21.5, 1.21.8, 1.21.10.
  BAND_COUNT: '6'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with full history and all branches
        uses: actions/checkout@v4
        with:
          # See the warning above: without this the audit silently has nothing
          # to compare and reports success.
          fetch-depth: 0

      - name: Fetch every band branch
        run: git fetch --no-tags origin '+refs/heads/mc/*:refs/remotes/origin/mc/*' || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove the auditor can still detect drift
        # Runs FIRST, and on its own synthetic repository. A drift report of
        # "nothing missing" is what a working auditor prints and also what a
        # broken one prints; this is the only thing that distinguishes them.
        run: python scripts/drift-audit.py --self-test

      - name: Audit every band branch against master
        # The `||` is load-bearing on the SCHEDULED run, not just the manual one:
        # `github.event.inputs` is null on a `schedule` event, so this fallback is
        # the value the weekly audit always uses. See BAND_COUNT above.
        run: |
          python scripts/drift-audit.py \
            --require-bands "${{ github.event.inputs.require_bands || env.BAND_COUNT }}" \
            --json drift-audit.json

      # ---------------------------------------------------------------------
      # The second, independent guard. It lives in THIS job because this is the
      # only workflow that already checks out full history and fetches every
      # band branch -- which is exactly what a cross-branch check needs, and
      # what nothing else here has.
      #
      # ⚠️ Both identity steps run with !cancelled() rather than on success, so
      # a red drift audit cannot HIDE a manifest collision. They answer two
      # unrelated questions and this is the one weekly run that asks either.
      #
      # ⚠️ Same weak leg as the audit above: weekly, from the default branch
      # only, reporting to a tab nobody opens (R11). A backstop, never the
      # check. The ship gate is where this actually gets run.
      # ---------------------------------------------------------------------
      - name: Prove the identity guard can still detect a collision
        if: ${{ !cancelled() }}
        # First, and on its own synthetic repository, for the same reason the
        # drift self-test runs first: "no collisions" is what a working guard
        # prints and also what a completely broken one prints.
        run: python scripts/manifest-identity-audit.py --self-test

      - name: Refuse two branches carrying a byte-identical mc-surface.txt
        if: ${{ !cancelled() }}
        # BAND_COUNT means the same thing to both scripts -- mc/** branches,
        # master excluded -- so the one declared number governs both floors.
        # Without a floor this guard passes trivially on a shallow clone: zero
        # pairs to compare reads exactly like zero collisions.
        run: |
          python scripts/manifest-identity-audit.py \
            --require-bands "${{ github.event.inputs.require_bands || env.BAND_COUNT }}" \
            --json manifest-identity.json

      - name: Prove the shared-layer guard can still detect drift
        if: ${{ !cancelled() }}
        # Same ordering rule as the two guards above: "no drift" is what a
        # working guard prints and also what a completely broken one prints,
        # and this is the only thing that tells them apart.
        run: python scripts/branch-file-identity-audit.py --self-test

      - name: Refuse a shared file that differs between branches
        if: ${{ !cancelled() }}
        # BAND_COUNT means the same thing to all three scripts -- mc/**
        # branches, master excluded -- so the one declared number governs
        # every floor.
        #
        # ⚠️ This guard has a SECOND way to pass trivially that the others do
        # not: if its include globs match nothing it compares zero files and
        # reports success. It exits 2 on an empty path set for exactly that
        # reason, so treat a 2 here as a red result, never as a skip.
        run: |
          python scripts/branch-file-identity-audit.py \
            --require-bands "${{ github.event.inputs.require_bands || env.BAND_COUNT }}" \
            --json branch-file-identity.json

      # ---------------------------------------------------------------------
      # The fourth guard (R-w'). It is NOT redundant with the two above: they
      # compare whole files, and gradle.properties is the one shared file that
      # can never be compared whole -- mod_version must match on every branch,
      # minecraft_version must differ, same file. drift-audit.py excludes it
      # for the second reason and therefore cannot see the first.
      #
      # ⚠️ Same weak leg as everything else in this job: weekly, from the
      # default branch only, into a tab nobody opens (R11). The ship gate is
      # where this actually gets run; this is the backstop.
      # ---------------------------------------------------------------------
      - name: Prove the per-key guard can still detect a divergence
        if: ${{ !cancelled() }}
        # First, on its own synthetic repositories, for the same reason as
        # every self-test above: "no violations" is what a working guard prints
        # and also what a completely broken one prints.
        run: python scripts/gradle-key-identity-audit.py --self-test

      - name: Refuse a divergent mod_version or a colliding minecraft_version
        if: ${{ !cancelled() }}
        # BAND_COUNT means the same thing to all four scripts -- mc/** branches,
        # master excluded -- so the one declared number governs every floor.
        # Without it this guard passes trivially on a shallow clone: zero pairs
        # to compare reads exactly like zero divergences.
        run: |
          python scripts/gradle-key-identity-audit.py             --require-bands "${{ github.event.inputs.require_bands || env.BAND_COUNT }}"             --json gradle-key-identity.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-audit
          path: |
            drift-audit.json
            manifest-identity.json
            branch-file-identity.json
            gradle-key-identity.json
          if-no-files-found: ignore
