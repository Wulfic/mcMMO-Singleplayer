#
#  Advanced configuration
#  Last updated on ${project.version}-b${BUILD_NUMBER}
#
#  For advanced users only! There is no need to change anything here.
#
#  You can customize almost every aspect of every skill here.
#  It's mainly here if you've customized the experience formula.
#  Configure at what level you get better with certain abilities.
#
#####

#
#  Settings for the Skills
###
# NOTE: upstream's Metrics.bstats key was removed here (2026-08-06). It switched off the bStats
# telemetry a Bukkit plugin sent to bstats.org. This port has no bStats dependency and sends no
# telemetry of any kind, so the key had no reader and, worse, implied there was something to opt out
# of. Nothing to wire; the honest form of "we do not phone home" is not shipping the switch.
Feedback:
    PlayerTips: true
    SkillCommand:
        BlankLinesAboveHeader: true
    # If sendtitles is true, messages will be sent using the title api (BIG TEXT ON SCREEN)
    Events:
        XP:
            SendTitles: true
        # Send notifications to the chat or actionbar of other nearby players when a user activates an ability
        AbilityActivation:
            SendNotificationToOtherPlayers: true
    #The actionbar is the message location right above the health bar
    ## If you disable the action bar messages, mcMMO will send the message to the chat system instead
    ActionBarNotifications:
        AbilityOff:
            Enabled: true
            SendCopyOfMessageToChat: false
        HardcoreMode:
            Enabled: true
            SendCopyOfMessageToChat: true
        RequirementsNotMet:
            Enabled: true
            SendCopyOfMessageToChat: false
        AbilityCoolDown:
            Enabled: true
            SendCopyOfMessageToChat: false
        LevelUps:
            Enabled: true
            SendCopyOfMessageToChat: true
        Holiday:
            Enabled: true
            SendCopyOfMessageToChat: true
        ToolReady:
            Enabled: true
            SendCopyOfMessageToChat: false
        SubSkillInteraction:
            Enabled: true
            SendCopyOfMessageToChat: false
        SubSkillFailed:
            Enabled: false
            SendCopyOfMessageToChat: true
        SubSkillUnlocked:
            Enabled: true
            SendCopyOfMessageToChat: true
        SuperAbilityInteraction:
            Enabled: true
            SendCopyOfMessageToChat: false
        SuperAbilityAlertOthers:
            Enabled: true
            SendCopyOfMessageToChat: true
        ExperienceGain:
            Enabled: true
            SendCopyOfMessageToChat: false
        ItemMessage:
            Enabled: true
            SendCopyOfMessageToChat: false
        NoPermission:
            Enabled: true
            SendCopyOfMessageToChat: true
        PartyMessage:
            Enabled: true
            SendCopyOfMessageToChat: true
        AbilityRefreshed:
            Enabled: true
            SendCopyOfMessageToChat: false
Skills:
    General:
        # Attack Cooldown refers to the strength of attacks in Minecraft.
        # If an attack is spammed, it will have less bonus damage and RNG for skills to activate from mcMMO.
        # If you want, you can turn this behavior off by setting it to false.
        Attack_Cooldown:
            Adjust_Skills_For_Attack_Cooldown: true
        LimitBreak:
            # Limit Break adds flat bonus damage per rank to all eight combat skills -- +1 at rank 1
            # (level 100 in Retro Mode) rising to +10 at rank 10 (level 1000). Against mobs the bonus
            # is NOT nerfed the way it is against a lightly-armoured player in multiplayer, so this
            # is a large power increase: +10 is more than a diamond sword's base damage of 7.
            #
            # OFF by default, deliberately. While it is off, Limit Break is invisible: it grants no
            # damage, is hidden from /mcstats, and fires no rank plaques -- so nothing tells you
            # about a mechanic you are not using.
            #
            # ⚠️ Turning it on: the bonus applies to every non-player entity. If you run mods that
            # add humanoid NPCs, they are "not players" as far as this is concerned and take the
            # full un-nerfed bonus too.
            AllowPVE: false
        StartingLevel: 0
        Ability:
            Length:
                Standard:
                    CapLevel: 100
                    IncreaseLevel: 5
                RetroMode:
                    CapLevel: 1000
                    IncreaseLevel: 50
            EnchantBuff: 5
            # IncreaseLevel: This setting will determine when the length of every ability gets longer with 1 second
            # EnchantBuff: This setting determines how many enchant levels to use when buffing Super Breaker & Giga Drill Breaker


    #
    #  Settings for Alchemy
    ###
    Alchemy:
        Catalysis:
            # MaxBonusLevel: Maximum bonus level of Catalysis, when a player reaches this level his brewing speed will be <MaxSpeed>
            # MinSpeed: Minimum brewing speed allowed when at <UnlockLevel> or lower
            # MaxSpeed: Maximum brewing speed allowed when at <MaxBonusLevel> or higher
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            MinSpeed: 1.0
            MaxSpeed: 4.0
    #
    #  Settings for Archery
    ###
    Archery:
        SkillShot:
            # RankDamageMultiplier: The current rank of this subskill is multiplied by this value to determine the bonus damage, rank 20 would result in 200% damage increase with a value of 10.0 for RankDamageMultiplier
            # RankDamageMultiplier is a percentage
            RankDamageMultiplier: 10.0
            # MaxDamage: After adding bonus damage, the total damage dealt by the player will not exceed this number
            # You should be careful to not set this too low
            MaxDamage: 9.0
        Daze:
            # ChanceMax: Maximum chance of causing daze to opponents when on <MaxBonusLevel> or higher
            # MaxBonusLevel: Maximum bonus level of Daze, when a player reaches this level his chance of causing a daze will be <ChanceMax>
            # Modifier: Extra damage for arrows that cause a daze (2 damage = 1 heart)
            ChanceMax: 50.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            BonusDamage: 4.0

        ArrowRetrieval:
            # ChanceMax: Maximum chance of retrieving arrows when on <MaxBonusLevel> or higher
            # MaxBonusLevel: Maximum bonus level for Arrow retrieval, at this level the chance of retrieving arrows from mobs is <ChanceMax>
            ChanceMax: 100.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

        # ForceMultiplier: Multiply the force of the bow by this for an XP boost.
        ForceMultiplier: 2.0
    #
    #  Settings for Axes
    ###
    Axes:
        AxeMastery:
            # This number is multiplied by the current rank the player has in this subskill to find the amount of additional damage to apply
            # With the default config value of 1.0, at rank 4 a player will deal 4.0 extra damage with Axes (1.0 * 4)
            RankDamageMultiplier: 1.0
        CriticalStrikes:
            # ChanceMax: Maximum chance of causing a critical hit when on <MaxBonusLevel> or higher
            # MaxBonusLevel: Level where <ChanceMax> of causing critical hits is reached
            ChanceMax: 37.50
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            # Damage modifier of critical hits for PVP / PVE, when causing a critical hit the damage gets multiplied by the modifier
            PVP_Modifier: 1.5
            PVE_Modifier: 2.0

        GreaterImpact:
            # Chance: Chance of hitting with GreaterImpact, mobs are knocked backwards when successful
            # KnockbackModifier: Velocity modifier of GreaterImpact hits, this determines how great the knockback is
            # BonusDamage: Extra damage for GreaterImpact hits
            Chance: 25.0
            KnockbackModifier: 1.5
            BonusDamage: 2.0

        ArmorImpact:
            # Multiplied against the skill rank to determine how much damage to do
            DamagePerRank: 6.5
            # IncreaseLevel: Every <IncreaseLevel> the durability damage goes up with 1
            # Chance: Chance of hitting with ArmorImpact
            # MaxPercentageDurabilityDamage: Durability damage cap for ArmorImpact, 20% means that you can never destroy a piece of armor in less than 5 hits
            Chance: 25.0
        SkullSplitter:
            # DamageModifier: Damage will get divided by this modifier
            DamageModifier: 2.0
    #
    #  Settings for Cooking
    ###
    Cooking:

        MasterChef:
            # ChanceMax: Maximum chance of pulling a second helping out of a finished cook.
            # MaxBonusLevel: On this level, that chance reaches <ChanceMax>.
            #
            # Deliberately below Smelting's SecondSmelt (50.0). A furnace's ore throughput is gated
            # by having to mine the ore; a smoker's food throughput is gated by nothing but chickens
            # and 5 seconds an item, so the same chance is worth appreciably more here.
            ChanceMax: 33.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

        PowerCook:
            # How long the mapped effect lasts, in seconds, per rank. Amplifier is ALWAYS 0 -- these
            # are a nudge, not a potion. A brewed Strength potion is 3:00 at amplifier 1, so even
            # rank 5 is twelve times shorter before the amplifier is counted; that gap is what stops
            # Cooking deleting Alchemy, and it is the whole effect budget.
            #
            # ⚠️ Any effect this grants must be one that does NOT fire every tick. See
            # config.yml -> Skills.Cooking.Power_Cook_Effects for the ban and the reason.
            Seconds_Per_Rank:
                Rank_1: 3
                Rank_2: 6
                Rank_3: 9
                Rank_4: 12
                Rank_5: 15

        KitchenEfficiency:
            # Fuel burns this many times longer when the furnace's INPUT is a food. Mirrors Smelting's
            # FuelEfficiency ladder exactly, because it is the same mechanic on the other side of a
            # gate that already exists (SmeltingManager#boostFuelTime gates on isSmeltable(input) so
            # that "cooking food burns at vanilla speed" -- this is that comment's else).
            Multiplier_Per_Rank:
                Rank_1: 2
                Rank_2: 3
                Rank_3: 4
    #
    #  Settings for Fishing
    ###
    Fishing:

        ShakeChance:
            Rank_1: 15.0
            Rank_2: 20.0
            Rank_3: 25.0
            Rank_4: 35.0
            Rank_5: 45.0
            Rank_6: 55.0
            Rank_7: 65.0
            Rank_8: 75.0

        # VanillaXPMultiplier: Vanilla XP gained from fishing is multiplied by these values.
        VanillaXPMultiplier:
            Rank_1: 1
            Rank_2: 2
            Rank_3: 3
            Rank_4: 3
            Rank_5: 4
            Rank_6: 4
            Rank_7: 5
            Rank_8: 5

        FishermansDiet:
            # This determines when Fisherman's Diet adds extra hunger recovery to food
            RankChange: 20

        MasterAngler:
            Boat_Tick_Reduction:
                Min_Wait: 10
                Max_Wait: 30
            Tick_Reduction_Per_Rank:
                Min_Wait: 10
                Max_Wait: 30
            Tick_Reduction_Caps:
                # Don't modify these two unless you fully understand what you are doing
                Min_Wait: 40
                Max_Wait: 100
    #
    #  Settings for Flying
    #
    #  Both blocks below moved here from the retired `Skills.Agility` on 2026-08-10, and this is
    #  the pair the move mattered most for: read against that skill's mean of
    #  three, Glide's unlock (350) needed Flying 1050 and SolarWings' (750) needed Flying 2250 from a
    #  player who only ever flew -- both past the 1000 cap, so a specialist could never unlock either.
    ###
    Flying:
        Glide:
            # Descend more slowly while gliding. Capped well below 1.0 so you can still land.
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            MaxDescentReduction: 0.5

        SolarWings:
            # A worn, damaged elytra slowly repairs in daylight. Deliberately a trickle: make this
            # generous and elytra durability stops being a resource at all.
            RepairPerInterval: 1
            IntervalTicks: 100
            GroundedMultiplier: 2

        # Arrived 2026-08-17 when Agility was retired. Fleet Footed and Second Wind were its last two
        # sub-skills; each carried one rank per medium and was gated on Agility -- the MEAN of Parkour,
        # Swimming and Flying -- so a specialist could never reach the rank for the medium they
        # actually trained. Each is now a single-rank sub-skill of the skill you earn by moving that
        # way. If you had tuned `Skills.Agility.FleetFooted` or `.SecondWind`, mcMMO moves your values
        # to these paths on first boot and tells you it did so.
        FleetFooted:
            # A per-tick forward velocity nudge while gliding; elytra flight is velocity-driven and has no
            # attribute behind it.
            # Scales linearly with Flying up to MaxBonusLevel, then stops.
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            MaxBonus: 0.15

        SecondWind:
            # Flying's body of Second Wind. The ability itself stays ONE super ability with one cooldown
            # and one trigger item, dispatched on how you are moving when you fire it -- only the
            # effect and what unlocks it are per-skill.
            LimitlessBoost: 1.2
    #
    #  Settings for Herbalism
    ###
    Herbalism:

        GreenThumb:
            # ChanceMax: Maximum chance of GreenThumb when on <MaxBonusLevel> or higher
            # MaxBonusLevel: On this level, GreenThumb chance will be <ChanceMax>
            ChanceMax: 100.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

        DoubleDrops:
            # ChanceMax: Maximum chance of receiving double drops when on <MaxBonusLevel> or higher
            # MaxBonusLevel: Level when <ChanceMax> of receiving double drops is reached
            ChanceMax: 100.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
        # VerdantBounty has no knobs of its own on purpose. It is not a roll -- it is a rider on
        # Green Terra: while that super ability is active a successful DoubleDrops roll yields two
        # extra drops instead of one. Tune it with DoubleDrops above. (The ChanceMax/MaxBonusLevel
        # that used to sit here were read by nothing but the /mcstats line, which quoted them at
        # players as if they governed the drop.)

        HylianLuck:
            # ChanceMax: Maximum chance of Hylian Luck when on <MaxBonusLevel> or higher
            # MaxBonusLevel: On this level, Hylian Luck chance will be <ChanceMax>
            ChanceMax: 10.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

        ShroomThumb:
            # ChanceMax: Maximum chance of ShroomThumb when on <MaxBonusLevel> or higher
            # MaxBonusLevel: On this level, ShroomThumb chance will be <ChanceMax>
            ChanceMax: 50.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
    #
    #  Settings for Hunter
    ###
    Hunter:
        MobMastery:
            # Mob Mastery is the per-creature half of Hunter: kill 500 / 2,500 / 10,000 of ONE mob
            # type and every hit you land on that type deals +1.0 / +2.0 / +3.0 extra damage.
            #
            # The kill thresholds and the bonuses themselves are NOT configurable, on purpose. They
            # are three numbers a player is meant to learn once and have mean the same thing for
            # every creature in the game -- the whole point of the horizontal axis.
            #
            # This is the one knob, and it ships at 1.0 (= no change to the ruled behaviour).
            #
            # WHY IT EXISTS: a melee bonus is already throttled by the vanilla attack-cooldown
            # charge, so spam-clicking pays less than a charged swing. A bow shot has no equivalent
            # throttle, so a fully-drawn arrow collects the whole +3.0 every time. If play-testing
            # finds ranged mastery over-tuned, turn this down instead of changing code; 0.5 halves
            # the bonus on arrows, bolts and thrown tridents while leaving melee exactly as ruled.
            #
            # A negative value is clamped to 0 -- earned mastery must never become a penalty.
            Ranged_Damage_Multiplier: 1.0

        Tiers:
            # Every creature in the game belongs to one of four Hunter tiers, and the tier decides
            # how much XP killing it pays. What each tier is WORTH lives in experience.yml under
            # Experience_Values.Hunter; this section decides only which tier a creature is IN.
            #
            # THERE IS NO MOB TABLE HERE, AND THAT IS THE DESIGN.
            #
            # The tier is worked out from the creature itself:
            #
            #   T1  anything that is not a monster                    chicken, cow, sheep, horse
            #   T2  any other monster                                 zombie, skeleton, creeper, spider
            #   T3  a monster with >= 30 health OR >= 6 attack damage  blaze, guardian, enderman, ravager
            #   T4  a monster with >= 150 health                      wither, ender dragon, warden
            #
            # (A non-monster with >= 60 health is promoted to T2. In vanilla that is the iron golem
            # and nothing else; it exists so a modded 300-health passive beast is not paid as a
            # chicken.)
            #
            # WHY DERIVED INSTEAD OF LISTED: a hand-written ~90-row mob table goes stale the moment
            # Mojang adds a creature or you install a mod, and its failure mode is SILENT -- the
            # unlisted mob resolves to zero and pays nothing forever. That has already happened
            # three times in this port (two species missing from Husbandry's breed table, three from
            # Fishing's). A derived tier cannot go stale, and it fails LOW rather than high.
            #
            # Overrides below name only the exceptions. Keys use the same form as
            # experience.yml's Combat.Multiplier table (Wither_Skeleton, not minecraft:wither_skeleton).
            # A value outside 1-4 is ignored with a warning and the derived tier is used instead.
            Overrides:
                # Both shipped entries fail the same way: THEIR DANGER IS NOT IN THEIR ATTRIBUTES.
                #
                # A ghast has 10 health and no attack-damage attribute at all -- it never melees,
                # it throws fireballs across a lava sea -- so it derives as an ordinary T2 monster.
                Ghast: 3
                # A wither skeleton's attack-damage attribute is the inherited default 2.0, exactly
                # the same as a plain skeleton's. Its stone sword and the wither effect do the work,
                # and neither is an attribute.
                Wither_Skeleton: 3
                #
                # Note what is NOT here: the witch, which the plan expected to need an override and
                # which the rule already places correctly at T2 (26 health, below the T3 line).

        TrophyHunter:
            # Chance that a creature you kill rolls its OWN loot table a second time.
            #
            # Not a bespoke bonus-item table and not a rare-slot bias: a second roll of the mob's own
            # table respects Looting, needs no per-mob data to go stale, and gives "more of what that
            # creature drops" -- more gunpowder and ender pearls, but also more rotten flesh.
            #
            # WHICH creatures you may roll is skillranks.yml -> Hunter.TrophyHunter, one rank per mob
            # tier. This is only HOW OFTEN, and it is the same number for every tier.
            #
            # ChanceMax ships at 50, not the 100 that Herbalism's and Mining's double drops use.
            # Those are blocks; this is the mob economy, which is what a grinder attacks -- and at
            # rank 4 it applies to bosses, so 100 would mean two nether stars from every wither. At 50
            # a trophy is a windfall at max level rather than the expected outcome. Turn it down
            # before turning it up.
            #
            # The roll is gated on the same four checks the kill counter passes (player-attributed,
            # PVE/PVP enabled, not a manufactured golem or summon, not spawner/bred/placed), so a farm
            # cannot be made to pay out twice by standing in it.
            ChanceMax: 50.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

    #
    #  Settings for Husbandry
    ###
    Husbandry:
        Twins:
            # Chance that one breeding produces TWO babies instead of one.
            #
            # ChanceMax ships at 25, not the wiki's 100, deliberately. Doubling every single breed at
            # max level is a food and mob-population firehose on its own, and it MULTIPLIES with
            # MultiBreed below rather than adding to it -- the two together at 100 would turn one
            # wheat into a whole herd. At 25 a twin birth stays a pleasant surprise at max rank
            # rather than the expected outcome. Raise this only after playing a maxed Husbandry with
            # a stocked pen and deciding it feels slow.
            #
            # Egg-laying breeders (frog, sniffer, turtle) never twin: vanilla hands them no baby to
            # copy, it hands them an egg, and duplicating that would be a different mechanic.
            ChanceMax: 25.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

        MultiBreed:
            # Feed ONE animal its breeding item and EVERY eligible animal of the same species within
            # the radius is set in love too, from that single item.
            #
            # There is no cap on the count any more. MaxAdditionalAnimals used to live here and was
            # removed on 2026-08-04 (GitHub #3): it taxed the mechanic rather than the reward -- the
            # whole point of the sub-skill is feeding the pen from where you stand -- and it never
            # actually bounded the XP rate, because it bounded XP per ITEM and wheat is free.
            #
            # The anti-exploit gate it was standing in for now sits on the XP payout instead, in
            # experience.yml as ExploitFix.Husbandry.Breed_Xp_Awards_Per_Window. Read the comment
            # there before tuning either one; the radius below is now the ONLY bound on the spread.
            #
            # If your advanced.yml still carries MaxAdditionalAnimals, it does nothing and the log
            # says so at startup. Delete it.

            # Reach in blocks, at unlock and at MaxBonusLevel. MaxRadius is HARD-CLAMPED to 40 in
            # code whatever you put here: this number sizes an entity sweep that runs every time any
            # player feeds any animal, so a mistyped 400 would scan a box eight chunks across.
            BaseRadius: 4.0
            MaxRadius: 40.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

        AcceleratedGrowth:
            # Babies you bred grow up faster, and a chance that feeding one counts twice.
            #
            # MaxGrowthAcceleration is the fraction of a newborn's childhood skipped at max level.
            # It is applied ONCE, the moment the animal is born, rather than by speeding its ageing
            # up every tick -- the player sees the same thing and the sub-skill never touches a tick
            # path. Only animals you bred yourself are affected; a baby you found in the wild has
            # nobody to credit.
            #
            # Keep this modest. Raising is the one income in this skill that cannot be rushed --
            # twenty real minutes per animal -- and that is exactly why it pays as much as breeding
            # does. It is HARD-CLAMPED to 0.90 in code: at 1.0 a newborn's age would be shortened
            # all the way to adulthood inside the breeding call itself, and the raise verb would pay
            # out in the same tick as the breed verb, for every animal, forever.
            MaxGrowthAcceleration: 0.30

            # Chance that one feed counts as two.
            ChanceMax: 25.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

        BountifulHarvest:
            # The harvest family's shared reward, driving all four harvest verbs -- shear, hive,
            # milk and brush -- through these same two rolls rather than copies of them.
            #
            # ChanceMax is the chance that a harvest yields a SECOND helping of whatever it just
            # dropped -- the animal's own loot roll run twice, so a sheep's colour and a mooshroom's
            # variant carry into the bonus for free instead of being re-derived from a table here.
            # Rolled once per harvest, not once per item, so a shear either doubles or it does not.
            #
            # ###################################################################################
            # This does NOT apply to anything a dispenser shears.
            # ###################################################################################
            # Every harvest verb in this skill requires a real player mid-interaction with the
            # animal. That is what keeps an AFK dispenser-and-hopper wool farm worth zero, and it is
            # enforced in code, not here -- there is no toggle for it on purpose.
            ChanceMax: 50.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

            # Chance that a harvest costs the tool no durability at all.
            #
            # Deliberately lower than ChanceMax above. A bonus drop is a windfall a player notices; a
            # durability save is only ever felt as "my shears last longer", so the same number buys
            # far less here -- and at 100 it would quietly turn shears into an infinite tool.
            DurabilitySaveChanceMax: 25.0

        Beekeeper:
            # Harvest a hive and the bees do not mind.
            #
            # The headline half of this sub-skill has NO knob here, on purpose: it is binary at the
            # unlock level in skillranks.yml. The point of it is being able to stop carrying a
            # campfire and stop planning your apiary around one, and a 90%-of-the-time version of
            # that is worse than not having it -- you would still have to build the campfire, for the
            # tenth harvest. Under the hood it is expressed as "you always count as standing over a
            # lit campfire", which is vanilla's own branch, so it suppresses both the nearby-bee
            # retargeting AND the hive's emergency release in one stroke.
            #
            # ChanceMax below is the second, smaller half: an extra helping of comb or honey. It
            # STACKS with BountifulHarvest above rather than replacing it, so a maxed beekeeper
            # visibly out-yields a maxed generalist on a hive. Kept modest because a full hive
            # already hands over three honeycombs at once.
            ChanceMax: 30.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

        SelectiveBreeding:
            # Offspring inherit better stats than the dice alone would have given them.
            #
            # MaxStatBias is the fraction of the gap between the rolled value and the best the SPECIES
            # allows that a foal is nudged. It is applied to the OUTCOME of vanilla's own inheritance
            # roll, not to the dice, so good parents still matter: vanilla rolls a bell curve around
            # the midpoint of the two parents widened by their spread, and this shifts the result
            # partway to the ceiling. It can only ever improve a foal, never worsen one.
            #
            # ###################################################################################
            # Keep this modest -- it COMPOUNDS down the generations.
            # ###################################################################################
            # Every foal is bred from parents that were themselves biased, so a number that looks fair
            # for one breeding walks toward the species maximum far faster than it reads. At 0.25 you
            # still reach near-perfect stock in a handful of generations, which is the fantasy; it just
            # takes the handful. HARD-CLAMPED to 0.50 in code, because 1.0 would not be "very good
            # horses", it would be every horse at exactly the maximum from the first breeding, which
            # deletes horse breeding as an activity instead of rewarding it.
            #
            # Only the horse family has inheritable stats in vanilla (health, speed, jump strength), so
            # this is where the sub-skill bites. The rare-variant half of the wiki's description is
            # NOT implemented -- see the note in plans/completed/husbandry.md.
            MaxStatBias: 0.25
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

        Brood:
            # Thrown eggs hatch more often, and sometimes hatch a whole clutch.
            #
            # ChanceMax LAYERS ON TOP of vanilla's 1-in-8 rather than replacing it: it is the chance
            # that Brood rescues an egg vanilla was about to waste, so the effective hatch rate is
            # 12.5% + ChanceMax x 87.5%. Written that way round on purpose -- if it replaced the roll,
            # a configured 10 would be a DOWNGRADE on vanilla, which is the kind of knob nobody
            # notices is backwards.
            ChanceMax: 35.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

            # Chance that a hatch yields vanilla's rare four chicks instead of one. Vanilla's own rare
            # case is 1-in-32 of a hatch; this is the same restraint Twins was ruled down to.
            MultiChickChanceMax: 20.0

            # NOTE: laying and collecting eggs pays NO XP and never will. ChickenEntity.eggLayTime is a
            # passive timer ticked in tickMovement, so a hopper under a coop is fully AFK income. Brood
            # is a yield sub-skill only, and a hatched chick carries no bred-by marker either -- one
            # would have turned that same AFK egg farm into a raise-XP farm twenty minutes later.

        HiddenBounty:
            # A rare find on any harvest, on top of whatever the animal already gave you.
            #
            # ChanceMax is only the FIRST of two gates. On a success, the Husbandry section of
            # treasures.yml is walked in file order and each candidate rolls its own Drop_Chance, so
            # the real rate for any one item is the product of the two. The table -- and the warning
            # that file order decides reachability -- lives in treasures.yml.
            ChanceMax: 20.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

        HerdsmansCall:
            # Husbandry's super ability. For its duration: nearby animals follow you without you
            # holding food, every harvest verb ignores its cooldown, and every harvest double-yields.
            #
            # DurationTicks is a FLOOR, not the length. The standard super-ability machinery decides
            # the real duration from your skill level and config.yml's Ability_Length /
            # Ability_Length_Cap / Max_Seconds.Herdsmans_Call, exactly like every other super; this
            # number only stops the ability being worth two seconds at the level it first unlocks.
            DurationTicks: 200

            # How far the call reaches, in blocks. Animals of any breedable species inside this radius
            # path toward you under vanilla's own navigation -- they are not teleported and not
            # velocity-shoved, so fences, walls and water still stop them.
            #
            # HARD-CLAMPED to 40 in code, the same ceiling Multi-Breed has and for the same reason:
            # this figure sizes an entity sweep that runs EVERY TICK for the whole duration, so a
            # mistyped 400 would scan a box eight chunks across twenty times a second.
            Radius: 16.0
    #
    #  Settings for Mining
    ###
    Mining:
        MotherLode:
            MaxBonusLevel:
                Standard: 1000
                RetroMode: 10000
            ChanceMax: 50.0
        SuperBreaker:
            # Whether a bonus-drop roll that succeeds WHILE Super Breaker is active yields two extra
            # copies (triple drops) instead of one. This is the quantity half of the ability's payout.
            AllowTripleDrops: true
            # How much Super Breaker multiplies the bonus-drop CHANCE by while it is active.
            #
            # Legacy mcMMO had no such knob: the ability changed only the quantity above, so the odds
            # of getting anything extra at all were identical with it on or off. That is what GitHub
            # #5 measured -- at Mining 267 the roll lands 26.7% of the time either way, and only the
            # size of that one success moved, while Excavation's Giga Drill Breaker triples EVERY
            # block. Set this to 1.0 for exact legacy behaviour.
            #
            # The result is capped at 100% by the probability itself, and values below 1.0 are refused
            # with a warning: a super ability must never lower its own skill's drop rate.
            BonusDropChanceMultiplier: 2.0
        DoubleDrops:
            SilkTouch: true
            # ChanceMax: Maximum chance of receiving double drops when on <MaxBonusLevel> or higher
            # MaxBonusLevel: Level when <ChanceMax> of receiving double drops is reached
            ChanceMax: 100.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

        BlastMining:
