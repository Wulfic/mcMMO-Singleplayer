    #
    #  Settings for Parkour
    ###
    #  Roll lives here because the fall XP it earns is paid to Parkour, so the level that gates it
    #  is the level those falls raise. It used to be gated on the retired Agility skill, whose level
    #  was the MEAN of Parkour, Swimming and Flying -- which levelled Roll at a third rate, and only
    #  for players who also swam and flew. Moved 2026-08-03 (GitHub #4). A `Skills.Agility.Roll`
    #  block left in your copy is relocated here automatically on load, and the log names the move.
    ###
    Parkour:
        Roll:
            # ChanceMax: Maximum chance of rolling when on <MaxBonusLevel> or higher
            # MaxBonusLevel: On this level or higher, the roll chance will not go higher than <ChanceMax>
            # DamageThreshold: The max damage a player can negate with a roll, graceful roll doubles this number
            ChanceMax: 100.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            DamageThreshold: 7.0

        # Moved here from `Skills.Agility.Dodge` on 2026-08-10. Dodge is a combat reaction rather than
        # a way of travelling, so it was the one sub-skill whose home was arguable -- it lives here
        # because it has always PAID its XP to Parkour, and a gate that levels off the very hits it
        # pays for is the arrangement GitHub #4 restored for Roll.
        Dodge:
            # ChanceMax: Maximum chance of dodging when on <MaxBonusLevel> or higher
            # MaxBonusLevel: On this level or higher, the dodge chance will not go higher than <ChanceMax>
            # DamageModifier: Dodge damage will be divided by this modifier
            ChanceMax: 20.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            DamageModifier: 2.0

        # Moved here from `Skills.Agility.Athlete` on 2026-08-10.
        Athlete:
            # Sprinting costs less hunger. Capped below 1.0 so sprinting is never free.
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            MaxExhaustionReduction: 0.5

        # Moved here from `Skills.Agility.Smash` on 2026-08-10.
        Smash:
            # Chance for a sprint-attack to deal bonus damage and extra knockback.
            ChanceMax: 25.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            BonusDamage: 2.0
            KnockbackStrength: 0.8


        # Arrived 2026-08-17 when Agility was retired. Fleet Footed and Second Wind were its last two
        # sub-skills; each carried one rank per medium and was gated on Agility -- the MEAN of Parkour,
        # Swimming and Flying -- so a specialist could never reach the rank for the medium they
        # actually trained. Each is now a single-rank sub-skill of the skill you earn by moving that
        # way. If you had tuned `Skills.Agility.FleetFooted` or `.SecondWind`, mcMMO moves your values
        # to these paths on first boot and tells you it did so.
        FleetFooted:
            # A percentage bonus on movement speed while sprinting, on top of the vanilla sprint multiplier.
            # Scales linearly with Parkour up to MaxBonusLevel, then stops.
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            MaxBonus: 0.20

        SecondWind:
            # Parkour's body of Second Wind. The ability itself stays ONE super ability with one cooldown
            # and one trigger item, dispatched on how you are moving when you fire it -- only the
            # effect and what unlocks it are per-skill.
            DartRange: 6.0
            DartDamage: 6.0
            DartKnockback: 1.5

        # SnowWalker has no advanced.yml block: the effect is binary (you walk on powder snow or you
        # do not), so there is nothing to tune. Its unlock level lives in skillranks.yml.

