    #
    #  Settings for Stealth
    ###
    Stealth:
        Padfoot:
            # Sneak faster. This is a flat addition to the vanilla `sneaking_speed` attribute, which
            # defaults to 0.3 (i.e. sneaking is 30% of walking speed) and which VANILLA ITSELF clamps
            # to a maximum of 1.0.
            #
            # That clamp is the real ceiling, which is why there is no cap of our own: no value you
            # put here can make sneaking faster than walking. The shipped 0.7 lands a maxed player
            # exactly at walking speed.
            #
            # Note it also applies while CRAWLING (vanilla applies the same attribute when you are in
            # a sneaking pose or crawling), so squeezing through a 1-block gap is faster too.
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            MaxSneakSpeedBonus: 0.7

        Assassin:
            # Backstab: hit harder while sneaking, if you have not been hit recently.
            #
            # MaxDamageBonus is a FRACTION, not a multiplier -- 1.0 means "double damage at max
            # level". It is multiplicative, so it compounds with your weapon skill's own on-hit bonus
            # and with a vanilla crit. That is the point of the sub-skill, but it is also the most
            # likely thing here to be over-tuned; test it against an armoured mob before trusting it.
            #
            # NoDamageWindowTicks: how long you must go without taking damage for a hit to count as a
            # backstab. 100 ticks = 5 seconds -- long enough that you cannot trade blows and keep
            # stabbing, short enough to break contact and re-enter stealth inside one fight.
            #
            # Cannot stack with Parkour's Smash: that one requires sprinting and this one requires
            # sneaking, and you cannot do both at once.
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            MaxDamageBonus: 1.0
            NoDamageWindowTicks: 100

        SmokeBomb:
            # Stealth's super ability: vanish. Applies vanilla Invisibility with no firework and no
            # particle burst.
            #
            # Remember that vanilla Invisibility does NOT hide armour or held items -- a fully
            # armoured player using this is still very visible. That is vanilla behaviour, not a bug.
            DurationTicks: 100

    #
    #  Settings for Swimming
    #
    #  One of Agility's three parents. Both blocks moved here from `Skills.Agility` on 2026-08-10:
    #  holding your breath and finding treasure in silt are earned by swimming, and under the
    #  three-skill mean they were partly gated on how much the player also ran and flew.
    ###
    Swimming:
        LeadLungs:
            # Extra air ticks restored per tick while submerged. Vanilla drains 1 per tick, so a value
            # of 1.0 would make breath infinite - the cap is deliberately below that.
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            MaxAirTopUpPerTick: 0.75

        LakeRaider:
            # Chance for an underwater block break to turn up treasure.
            ChanceMax: 15.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

        # Arrived 2026-08-17 when Agility was retired. Fleet Footed and Second Wind were its last two
        # sub-skills; each carried one rank per medium and was gated on Agility -- the MEAN of Parkour,
        # Swimming and Flying -- so a specialist could never reach the rank for the medium they
        # actually trained. Each is now a single-rank sub-skill of the skill you earn by moving that
        # way. If you had tuned `Skills.Agility.FleetFooted` or `.SecondWind`, mcMMO moves your values
        # to these paths on first boot and tells you it did so.
        FleetFooted:
            # NOT a movement-speed bonus: swim speed ignores movement speed unless water movement efficiency
            # is above zero, so this raises that attribute directly. It is the one Depth Strider uses and
            # vanilla hard-caps it at 1.0 -- a Depth Strider III player is already at the cap and gains
            # nothing here, which is intended rather than a bug.
            # Scales linearly with Swimming up to MaxBonusLevel, then stops.
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            MaxBonus: 0.50

        SecondWind:
            # Swimming's body of Second Wind. The ability itself stays ONE super ability with one cooldown
            # and one trigger item, dispatched on how you are moving when you fire it -- only the
            # effect and what unlocks it are per-skill.
            AquamanAmplifier: 1
    #
    #  Settings for Swords
    ###
    Swords:
        Stab:
            Base_Damage: 1.0
            Per_Rank_Multiplier: 1.5
        Rupture:
            Rupture_Mechanics:
                # This is % chance, 15 would mean 15% percent of the time
                Chance_To_Apply_On_Hit:
                    Rank_1: 15
                    Rank_2: 33
                    Rank_3: 40
                    Rank_4: 66
                Duration_In_Seconds:
                    Against_Players: 5
                    Against_Mobs: 5
                # Tick interval damage is applied twice a second during rupture, it is "pure" and does not get lowered from armor or absorption etc
                Tick_Interval_Damage:
                    Against_Players:
                        Rank_1: 0.1
                        Rank_2: 0.15
                        Rank_3: 0.2
                        Rank_4: 0.3
                    Against_Mobs:
                        Rank_1: 0.5
                        Rank_2: 0.75
                        Rank_3: 0.9
                        Rank_4: 1
                # If Rupture runs for 5 seconds without being reapplied, it explodes
                # this damage is **NOT** pure and is reduced dramatically vs armor/absorption/etc
                Explosion_Damage:
                    Against_Players:
                        Rank_1: 10
                        Rank_2: 20
                        Rank_3: 30
                        Rank_4: 40
                    Against_Mobs:
                        Rank_1: 10
                        Rank_2: 20
                        Rank_3: 30
                        Rank_4: 40
        CounterAttack:
            # ChanceMax: Maximum chance of triggering a counter attack
            # MaxBonusLevel: On this level, the chance to Counter will be <ChanceMax>
            ChanceMax: 30.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000

            # DamageModifier: Damaged caused by the damager will get divided by this modifier and dealt back to the damager
            DamageModifier: 2.0

        SerratedStrikes:
            # DamageModifier: Damage will get divided by this modifier
            # The bleed Serrated Strikes inflicts on the entities it cleaves is Rupture, so its
            # duration and tick damage come from Skills.Swords.Rupture.Rupture_Mechanics above.
            DamageModifier: 4.0
    #
    #  Settings for Taming
    ###
    Taming:
        Gore:
            # ChanceMax: Maximum chance of triggering gore
            # MaxBonusLevel: On this level, the chance to cause Gore will be <ChanceMax>
            ChanceMax: 100.0
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            # Modifier: Damage will get multiplied by this modifier
            Modifier: 2.0
        FastFoodService:
            # Chance: The chance for wolves to heal hp when inflicting damage
            Chance: 50.0
        ThickFur:
            # Modifier: Damage will get divided by this modifier
            Modifier: 2.0
        ShockProof:
            # Modifier: Damage will get divided by this modifier
            Modifier: 6.0
        SharpenedClaws:
            # Bonus: This bonus will get added to the damage caused
            Bonus: 2.0
        CallOfTheWild:
            # MinHorseJumpStrength: The minimum jump strength a summoned horse must have
            # MaxHorseJumpStrength: The maximum jump strength a summoned horse can have
            MinHorseJumpStrength: 0.7
            MaxHorseJumpStrength: 2.0
        Pummel:
            # ChanceMax: Maximum chance of triggering pummel
            Chance: 10.0
    #
    #  Settings for Unarmored
    ###
    Unarmored:
        IronSkin:
            # Innate "skin" armour, granted ONLY while all four armour slots are empty.
            #
            # These are real vanilla armour points -- the same units a chestplate gives -- applied
            # as an attribute modifier, so they show up on your armour bar and obey vanilla's own
            # damage formula. The four tiers are the four RANKS of the Iron Skin sub-skill; the
            # levels they unlock at live in skillranks.yml, so a breakpoint moves in one file only.
            #
            # Values match the real armour sets: leather 7, gold 11, iron 15, diamond 20.
            #
            # NOTE: no armour TOUGHNESS is granted at any tier, and that is deliberate. Toughness is
            # what blunts LARGE hits, so withholding it is exactly what keeps real armour worth
            # wearing -- a diamond skin (20 armour, 0 toughness) still takes noticeably more from a
            # heavy blow than a diamond set (20 armour, 8 toughness), and real armour keeps its
            # enchantments on top. Raising these values erodes that; adding toughness removes it.
            Armor_Points:
                Tier_1: 7.0
                Tier_2: 11.0
                Tier_3: 15.0
                Tier_4: 20.0

        ThornySkin:
            # Reflect a sting back at whatever just punched you, while unarmored.
            #
            # KEEP THIS TINY. The shipped 1.0 is half a heart. A reflect costs the player nothing,
            # needs no aim, and fires on every hit taken -- so any value large enough to feel
            # powerful is large enough to kill mobs by standing still and being hit, which is the
            # exact AFK-farm shape the rest of this skill is built to avoid.
            #
            # Melee only: fall damage, fire and arrows reflect nothing.
            MaxBonusLevel:
                Standard: 100
                RetroMode: 1000
            MaxReflectDamage: 1.0

