Hunter:
    # Trophy Hunter's four ranks ARE the four mob tiers, in order: rank N unlocks the bonus loot roll
    # against tier-N creatures and nothing above them. There is no fifth rank and there never will
    # be -- the tier scale is 1-4 (see advanced.yml -> Skills.Hunter.Tiers).
    #
    #   Rank 1  T1  anything that is not a monster        chicken, cow, sheep, horse
    #   Rank 2  T2  ordinary monsters                     zombie, skeleton, creeper, spider
    #   Rank 3  T3  dangerous monsters                    blaze, guardian, enderman, ravager
    #   Rank 4  T4  bosses                                wither, ender dragon, warden
    #
    # WHY IT CLIMBS INSTEAD OF UNLOCKING AT ONCE: the whole vertical axis of Hunter is "kill a wide
    # variety of things and get better loot for it", and a ladder that starts on livestock and ends
    # on bosses is that sentence as a config. It also means the reward arrives while the skill is
    # still cheap to level, rather than all at once at the far end.
    #
    # Hunter's OTHER sub-skill, Mob Mastery, is deliberately absent from this file. It unlocks on a
    # per-creature kill counter (500 / 2,500 / 10,000 of ONE mob), which no level-keyed rank can
    # express -- putting it here would produce a rank display that lies. See HunterManager.
    QuarrySense:
        # Sneak and hit a creature with a bone in hand to read your hunt log against it: how many you
        # have killed, which mastery tier that is, and how many more the next tier wants.
        #
        # LEVEL 1 IN BOTH MODES, and that is not laziness -- it is Taming's Beast Lore, which this
        # extends, and it is the same call for the same reason. Mob Mastery's counters are invisible
        # from the very first kill, and this is the only place in the world a player can see one.
        # Gating the window behind a level would recreate exactly the problem the sub-skill exists to
        # solve: 499 kills of nothing appearing to happen.
        Standard:
            Rank_1: 1
        RetroMode:
            Rank_1: 1
    TrophyHunter:
        Standard:
            Rank_1: 10
            Rank_2: 30
            Rank_3: 60
            Rank_4: 90
        RetroMode:
            Rank_1: 100
            Rank_2: 300
            Rank_3: 600
            Rank_4: 900
Husbandry:
    # Both breed-family sub-skills unlock immediately. Breeding IS the skill's entry verb -- it is
    # the first thing a player does and the only XP source Husbandry has until stage 2 -- so gating
    # its two sub-skills behind levels would mean the early skill is levelled by doing the one thing
    # neither of them affects yet. Their strength scales from zero regardless, via ChanceMax and
    # MultiBreed's radius in advanced.yml, so "unlocked at 1" does not mean "strong at 1".
    MultiBreed:
        Standard:
            Rank_1: 1
        RetroMode:
            Rank_1: 1
    Twins:
        Standard:
            Rank_1: 1
        RetroMode:
            Rank_1: 1
    # Unlike the two above, this one IS gated: it shortens the wait on the raise verb, so handing it
    # over at level 1 would speed up the income a new player has not yet earned the right to speed up.
    AcceleratedGrowth:
        Standard:
            Rank_1: 15
        RetroMode:
            Rank_1: 150
    # Unlocked at 1, like the breed-family pair and for the same reason: shearing is one of the
    # skill's entry verbs, and gating its only sub-skill behind a level would mean the early skill is
    # levelled by doing the one thing nothing rewards yet. Its strength scales from zero regardless.
    BountifulHarvest:
        Standard:
            Rank_1: 1
        RetroMode:
            Rank_1: 1
    # Gated, and further out than AcceleratedGrowth. Beekeeper removes a real logistical constraint --
    # never needing a campfire under a hive again -- and that constraint is most of what makes early
    # beekeeping interesting. Handing it over cheaply would delete the puzzle before a player has met
    # it.
    Beekeeper:
        Standard:
            Rank_1: 10
        RetroMode:
            Rank_1: 100
    # The flavour tier, gated furthest out of anything in the skill. None of these three change what a
    # player can do -- they change how well it goes -- so they are the reward for having kept livestock
    # for a long time rather than tools handed over to make the early skill workable.
    Brood:
        Standard:
            Rank_1: 20
        RetroMode:
            Rank_1: 200
    SelectiveBreeding:
        Standard:
            Rank_1: 25
        RetroMode:
            Rank_1: 250
    HiddenBounty:
        Standard:
            Rank_1: 30
        RetroMode:
            Rank_1: 300
    # The super. Earlier than the flavour tier above on purpose: it multiplies every verb in the skill,
    # so it is meaningless until they all work -- but once they do, it is the thing a player is actually
    # working toward, and burying it behind the flavour perks would hide the skill's payoff.
    HerdsmansCall:
        Standard:
            Rank_1: 10
        RetroMode:
            Rank_1: 100
