# AGILITY WAS RETIRED 2026-08-17 and its block deleted from this file. It had been a CHILD skill --
# its level was the mean of Parkour, Swimming and Flying -- holding the last two sub-skills that
# worked in all three mediums, each carrying one rank PER medium.
#
# MOVED OUT 2026-08-10: Dodge/Athlete/Smash -> Parkour, LeadLungs/LakeRaider -> Swimming,
# Glide/SolarWings -> Flying, numbers unchanged.
# MOVED OUT 2026-08-17: FleetFooted and SecondWind -> ALL THREE parents, one single-rank sub-skill
# each. Their numbers were NOT carried over. As ranks 1/2/3 of one shared ladder they read
# 1/200/400 and 250/500/750 against the MEAN, which encoded unlock ORDER (land, then water, then
# air). Split across three parents there is no order left to encode, so every medium now unlocks at
# what rank 1 cost: FleetFooted 1, SecondWind 250 (RetroMode). This is a buff for specialists -- a
# pure flier capped Agility at 333 and could never reach the air ranks at all.
#
# Parkour, Swimming and Flying were Agility's three parent skills. Every sub-skill below is gated on
# that parent's OWN level, so it is earned by doing the thing it is a perk for.
Parkour:
    SnowWalker:
        Standard:
            Rank_1: 10
        RetroMode:
            Rank_1: 100
    # Dodge, Athlete and Smash moved here from Agility on 2026-08-10 with their numbers untouched.
    # Read against Parkour instead of the mean of three, they unlock roughly 3x sooner for a player
    # who runs rather than swims and flies -- which is the point of the move.
    Dodge:
        Standard:
            Rank_1: 1
        RetroMode:
            Rank_1: 1
    Athlete:
        Standard:
            Rank_1: 5
        RetroMode:
            Rank_1: 50
