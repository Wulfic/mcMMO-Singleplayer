#
#  Settings for XP formula
###
Experience_Formula:
    # Valid values are: LINEAR and EXPONENTIAL
    # If an invalid value is entered, this will reset to the default setting, which is LINEAR
    # LINEAR:      base + (level * multiplier)
    # EXPONENTIAL: multiplier * level ^ exponent + base
    Curve: LINEAR

    # If invalid values are entered mcMMO will not start and print an error in the console
    Linear_Values:
        base: 1020
        multiplier: 20
    Exponential_Values:
        multiplier: 0.1
        exponent: 1.80
        base: 2000

    # Cumulative experience curves will use a players power level instead of their skill level,
    # players with high power levels will have to gain a lot more experience to reach the next level in every skill.
    Cumulative_Curve: false

    # Experience gained in every skill will get multiplied by this value. 1.0 by default, 2.0 means two times as much
    Multiplier:
        Global: 1.0
        PVP: 1.0

    # Experience gained from mobs not naturally spawned will get multiplied by this value. 0 by default.
    Eggs:
        Multiplier: 0
    Mobspawners:
        Multiplier: 0
    Nether_Portal:
        Multiplier: 0
    Breeding:
        Multiplier: 1.0

    # Experience gained will get multiplied by these values. 1.0 by default, 0.5 means half XP gained. This happens right before multiplying the XP by the global multiplier.
    Skill_Multiplier:
        Spears: 1.0
        Maces: 1.0
        Crossbows: 1.0
        Tridents: 1.0
        Swords: 1.0
        Taming: 1.0
        # No CHILD skill belongs here (Agility, Salvage, Smelting). A child earns no XP of its own --
        # its level is the mean of its parents -- so both XP paths split the gain to those parents and
        # return before any multiplier is consulted. Agility had a row and a settings slider that
        # could never do anything; Salvage and Smelting correctly never did.
        Parkour: 1.0
        Swimming: 1.0
        Flying: 1.0
        Stealth: 1.0
        Excavation: 1.0
        Herbalism: 1.0
        Hunter: 1.0
        Husbandry: 1.0
        Unarmed: 1.0
        Unarmored: 1.0
        Woodcutting: 1.0
        Mining: 1.0
        Archery: 1.0
        Axes: 1.0
        Repair: 1.0
        Fishing: 1.0
        Alchemy: 1.0
        Cooking: 1.0

    # XP earned by players with the permission mcmmo.perks.xp.customboost.<skillname> will get multiplied
    # with 1.25 by default, resulting in a 25% XP boost
    Custom_XP_Perk:
        Boost: 1.25

#
# Settings for Diminished Returns
###
Diminished_Returns:
    #This is the minimum amount of XP a player will earn after reaching the timed threshold (this is to prevent punishing a player too hard for earning XP)
    ## A value of 1 would mean that a player gets FULL XP, which defeats the purpose of diminished returns, the default value is 0.05 (5% minimum XP)
    ### Set this value to 0 to turn it off
    Guaranteed_Minimum_Percentage: 0.05
    Enabled: false

    # Limit the amount of experience a player can earn:
    # Threshold (amount of experience) per Time_Interval (in minutes)
    Threshold:
        # Only NON-CHILD skills belong here. Agility, Salvage and Smelting earn no XP of their own
        # -- a gain is split to their parents before it reaches the throttle -- so a Threshold entry
        # for any of them would be a knob wired to nothing. Agility had one until 2026-08-06.
        # DiminishedReturnsThresholdCatalogueTest pins both directions.
        Swords: 20000
        Taming: 20000
        # 20000 per 10 minutes is 33 XP/s. The movement skills pay 15-17 XP/s flat out, so this
        # throttle sits close enough to matter if Diminished_Returns is ever switched on -- raise
        # these three before enabling it, or travel gets punished for being continuous.
        Parkour: 20000
        Swimming: 20000
        Flying: 20000
        # Stealth pays 25 XP/s flat out -- the highest continuous rate in the mod -- so this throttle
        # bites sooner for it than for anything else if Diminished_Returns is ever switched on.
        Stealth: 20000
        Excavation: 20000
        Herbalism: 20000
        # ⚠️ Hunter is the ONE skill this throttle would bite hardest on, and it is the reason the
        # Hunter plan says so explicitly: a boss is worth ~1,500 XP, so fourteen wither kills inside ten
        # minutes would trip 20,000. That is not reachable by hand, but it is trivially reachable by a
        # farm -- which means if Diminished_Returns is ever switched on, this number is doing real work
        # rather than sitting far out of reach the way every other entry here does. Raise it only after
        # measuring; do not "tidy" it up to match its neighbours.
        Hunter: 20000
        # Husbandry is gated by vanilla's own clocks -- a five-minute love cooldown per animal,
        # twenty real minutes for a baby to mature, grass regrowth before a sheep is worth shearing
        # again -- so this threshold is nowhere near reach in practice.
        Husbandry: 20000
        Unarmed: 20000
        # Unarmored is episodic rather than continuous -- you cannot take damage faster than the
        # vanilla invulnerability window allows, and you die at 20 HP -- so this threshold is far
        # out of reach in practice. It is here for completeness, not because it binds.
        Unarmored: 20000
        Woodcutting: 20000
        Mining: 20000
        Archery: 20000
        Axes: 20000
        Repair: 20000
        Fishing: 20000
        Alchemy: 20000
        # Cooking shipped with no entry at all until 2026-08-06 -- it was the 27th skill and the
        # table was hand-kept. It already carries its own ExploitFix.Cooking.Max_Cooks_Per_Hour
        # rate cap, which bites long before this throttle would.
        Cooking: 20000
        Crossbows: 20000
        Tridents: 20000
        Maces: 20000
        Spears: 20000

    Time_Interval: 10

#
#  Settings for XP conversion with '/mcconvert experience'
###
Conversion:
    # Old experience will get divided by this modifier
    Exp_Modifier: 1

#
#  Settings for XP distribution
###
Experience_Values:
    PVP:
        Rewards: true
    # Renamed from `Agility` on 2026-08-17. A neutral root for the XP model the three movement
    # skills SHARE -- filing it under Parkour, Swimming or Flying would read as a lie in the other
    # two. Your tuned values are moved here on first boot.
    Movement:
        Dodge: 800
        Roll: 600
        Fall: 600

        # FeatherFall_Multiplier: Multiply fall XP by this value when wearing boots with the Feather Fall enchant
        FeatherFall_Multiplier: 2.0

        # Movement XP (Land / Water / Air domains).
        #
        # Movement pays XP per SECOND of qualifying travel, not per block, and each tick's distance is
        # clamped at that medium's reference speed before it counts. This is deliberate and it is the
        # load-bearing balance decision of the skill:
        #
        #   * Without it a fast medium out-earns a slow one for less effort (an elytra covers ground
        #     ~5x faster than sprinting and ~10x faster than swimming).
        #   * Without it every speed buff is also an XP multiplier - Depth Strider, Dolphin's Grace,
        #     Speed potions, ice boats, firework rockets.
        #   * Without it the skill accelerates its own levelling, because Fleet Footed makes you
        #     faster, which earns more XP per second, which levels Fleet Footed. No amount of tuning
        #     an XP-per-block number fixes a feedback loop.
        #
        # Travel at or above the reference speed pays the full rate and never more; travel slower
        # pays pro-rata; standing still pays nothing. XP-per-block is a DERIVED quantity - nobody
        # tunes it, it falls out of the reference speed.
        # Renamed from `Movement` on 2026-08-18: its parent block is now called Movement too, and
        # `Experience_Values.Movement.Movement` is not a path anyone should have to read. `Travel` is
        # the honest name -- this is the per-SECOND travel model, as against the episodic Dodge, Roll
        # and Fall values beside it.
        Travel:
            # XP per second of travel, before the per-medium multiplier.
            #
            # Halved from the original 30.0 (2026-07-27). Movement is the most passive XP source in
            # the mod - you earn it for playing the game normally - so it should not out-earn a skill
            # you have to actively work at. Walking earns nothing at all, and neither does moving
            # while crouched (that is the Stealth skill's territory).
            Baseline_Xp_Per_Second: 15.0

            # Blocks per second each medium pays full rate at. Travel faster than this is clamped.
            # Land is the well-known vanilla sprint speed (walk 4.317 x 1.3). Water and Air are
            # starting estimates and should be MEASURED in-game and corrected here.
            Reference_Speed:
                Land: 5.61
                Water: 3.16
                Air: 30.0

            # Per-medium payout multiplier. Water is slow and tedious, air is near-effortless and
            # covers the whole world, so they are weighted up and down respectively.
            # At the defaults this yields ~2.67 XP/block on land, ~5.46 in water, ~0.30 in air, and
            # roughly 204h / 178h / 340h of continuous travel to max a RetroMode level-1000 skill.
            Medium_Multiplier:
                Land: 1.0
                Water: 1.15
                Air: 0.6
    Alchemy:
        Potion_Brewing:
            # Alchemy potion stages are based on the number of ingredients added
            # Stage_1 represents a base potion
            # Stage_2 represents a base potion with one ingredient
            # Stage_3 represents a base potion with one ingredient and one amplifier
            # Stage_4 represents a base potion with one ingredient and two amplifiers
            # Stage_5 represents a base potion with one ingredient where the amplifiers are swapped
            Stage_1: 666
            Stage_2: 1111
            Stage_3: 1750
            Stage_4: 2250
            Stage_5: 0
