    # Cooking sits directly under Smelting because it is Smelting's other half: the two share the
    # furnace and split it by INPUT. Ore pays Smelting, food pays Cooking, and never both -- the
    # listener checks Smelting first and Cooking is the else, which is the same order the fuel-bonus
    # gate has enforced since the Smelting port ("so cooking food burns at vanilla speed").
    #
    # ##########################################################################################
    # TWO SUBSECTIONS, AND THEY ARE NOT INTERCHANGEABLE. DO NOT MERGE THEM.
    # ##########################################################################################
    # Cook:  keyed by what goes INTO the furnace/smoker/campfire (beef, potato, kelp).
    # Craft: keyed by what comes OUT of the crafting grid (bread, cookie, dried_kelp).
    #
    # dried kelp is why the split exists. Smoking a KELP is a real cook worth 60. But crafting a
    # DRIED_KELP is not: 9 dried kelp craft into a dried kelp block and the block crafts straight
    # back into 9 dried kelp, consuming nothing at all. Priced per item, that is infinite XP at the
    # speed of a crafting grid, with no ingredient, no fuel and no farm. Honey bottles round-trip
    # through a honey block exactly the same way. Both are therefore 0 under Craft and only under
    # Craft -- one flat section could not have said that.
    Cooking:
        # What the furnace, smoker, blast furnace or campfire consumed. These nine are every food
        # input vanilla has (derived from the shipped recipe JSONs, not written from memory).
        Cook:
            # The core verb, and the number the whole XP budget is derived from.
            Beef: 100
            Porkchop: 100
            Chicken: 100
            Mutton: 100
            Rabbit: 100
            Cod: 100
            Salmon: 100
            # One free ingredient and no crafting step, so worth less than a slaughtered animal.
            Potato: 60
            # NOTE: kelp is not itself a food -- it has no food component at all, dried kelp does.
            # It is listed here because this section is keyed on the INPUT. A table written by
            # filtering "which foods can be cooked" drops dried kelp from the skill entirely.
            Kelp: 60
            # Explicitly 0, not merely absent. Chorus fruit IS a furnace food input, but it smelts
            # into popped chorus fruit, which is not food and is not cooking -- and a chorus farm is
            # fully automatable. Left absent, a future reader would take it for an oversight.
            Chorus_Fruit: 0
        # What came out of the crafting grid. Priced PER ITEM: the game hands the whole batch over
        # in one take, so these are multiplied by the count produced.
        Craft:
            Bread: 80                # 3 wheat
            Mushroom_Stew: 150       # 2 mushrooms + a bowl
            Beetroot_Soup: 150       # 6 beetroot + a bowl
            Rabbit_Stew: 150         # 5 ingredients + a bowl
            Pumpkin_Pie: 200         # pumpkin + sugar + egg
            Cake: 300                # 3 milk + 2 sugar + 1 egg + 3 wheat, and it yields ONE
            Cookie: 10               # x8 per craft, so 80 for the recipe -- see the per-item note
            # The two free-loop foods. See the block comment above; these must stay at 0.
            Dried_Kelp: 0
            Honey_Bottle: 0
            # 8 gold ingots. A gold farm is not a cooking skill.
            Golden_Apple: 0
            Golden_Carrot: 0
            # 0 on purpose rather than absent: suspicious stew IS crafted (16 recipes, one per
            # flower), and its effects live on their own component, so Cooking stays out of it.
            Suspicious_Stew: 0
    Hunter:
        # XP for ONE qualifying kill, by the victim's tier.
        #
        # Which tier a creature is in is NOT set here -- it is derived from the creature itself, with
        # a short exception list in advanced.yml under Skills.Hunter.Tiers. This file only prices the
        # tiers. (T1 passive, T2 common hostile, T3 dangerous, T4 boss.)
        #
        # PER KILL, NOT PER HIT -- Hunter is the only combat skill like that. Swords, Axes, Archery
        # and the rest pay per hit, scaled by the damage that hit landed. Hunter's subject is WHICH
        # CREATURE died, which is not a question a hit can answer, and paying per hit would make a
        # 500-health warden worth twenty-five zombies for reasons that have nothing to do with the
        # tier the player is being paid for.
        #
        # WHERE THESE NUMBERS COME FROM. The curve is 10N^2 + 1010N, so a RetroMode level-1000 Hunter
        # costs 11,010,000 XP. At a sustained hand-killing rate of about 6 kills/min (360/h) the
        # ~100 hour target wants roughly 306 XP for an average kill -- which is what puts common
        # hostiles, the overwhelming majority of what anyone actually kills, at 300.
        #
        #   T1  100  -> 110,100 kills to max on that tier alone
        #   T2  300  ->  36,700
        #   T3  800  ->  13,762
        #   T4 1500  ->   7,340
        #
        # T4 IS 1500 AND NOT THE DRAFTED 5000 on purpose (ruled 2026-07-30). At 5000 a wither farm
        # outruns the 80-hour guardrail every skill in this port is held to. A tier nobody can safely
        # reach is worse than a cheap one.
        #
        # A negative value is clamped to 0. Handing a player negative XP walks their level backwards,
        # which is not a tuning choice anyone makes deliberately.
        Tier_1: 100
        Tier_2: 300
        Tier_3: 800
        Tier_4: 1500
    Stealth:
        # Sneak XP.
        #
        # Stealth uses the SAME speed-normalised model as the movement skills (see the long
        # comment under Experience_Values.Movement.Travel): XP is paid per SECOND of qualifying
        # sneak-travel, with each tick's distance clamped at the reference speed below.
        #
        # The clamp matters even more here than it does for movement. Padfoot raises the vanilla
        # sneaking_speed attribute from 0.3 toward 1.0, so a maxed player sneaks more than THREE
        # TIMES faster than an unranked one (Fleet Footed, by comparison, is worth 20%). Paying per
        # block would make Padfoot a 3.3x multiplier on its own XP rate. Under the clamp a maxed
        # Padfoot player earns the same XP per second and simply covers more ground doing it.
        #
        # Only sneaking ON THE GROUND pays. Crouch-swimming pays nothing -- it is faster than the
        # sneak reference speed, so it would always sit at the clamp, which would make "hold shift
        # in a water current" the optimal way to level the skill.
        Sneak:
            # XP per second of qualifying sneak-travel.
            #
            # 50 XP/s maxes a RetroMode level-1000 skill in ~61 hours of continuous sneaking, versus
            # ~204h for movement on land -- deliberately the fastest continuous earner in the mod
            # (GitHub #6, doubled from 25). Sneaking is slow, tedious, halves your speed and is
            # something players do in short bursts rather than to get anywhere, so it is priced for
            # the attention it costs rather than the distance it covers.
            #
            # Raised AFTER release, so the change is declared in ConfigRetunes and carried onto an
            # existing config on the next load -- editing this line alone would reach nobody who has
            # already run the mod. See that class before changing any shipped value here.
            Baseline_Xp_Per_Second: 50.0

            # Blocks per second sneaking pays full rate at. Sneaking faster than this -- with
            # Padfoot, or a Speed potion -- is clamped and pays no more.
            #
            # Derived as vanilla walk speed (4.317) x the sneaking_speed attribute default (0.3).
            # The 0.3 is exact; the walk speed should be MEASURED in-game and corrected here.
            # Yields ~19.3 XP per block at the default baseline -- a DERIVED number, do not tune it.
            Reference_Speed: 1.295
