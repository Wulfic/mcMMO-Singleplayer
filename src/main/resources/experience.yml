# These are the only valid colors for Experience Bars, use the exact name found here
# BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW (As of the time of this update these are the only Bar colors available, this could change in the future so check the BarColor enum to see if it has)
# BarStyle Settings (USE THE EXACT NAME) :
#SEGMENTED_10
#   Splits the boss bar into 10 segments
#SEGMENTED_12
#   Splits the boss bar into 12 segments
#SEGMENTED_20
#   Splits the boss bar into 20 segments
#SEGMENTED_6
#   Splits the boss bar into 6 segments
#SOLID
#   The bar is one solid piece
EarlyGameBoost:
    Enabled: true
ExploitFix:
    Combat:
        XPCeiling:
            Enabled: true
            Damage_Limit: 100
    Cooking:
        # How many cooked or crafted ITEMS may pay Cooking XP inside one rolling hour.
        #
        # ######################################################################################
        # THIS IS THE ONLY ANTI-FARM GATE COOKING HAS.
        # ######################################################################################
        # Every other skill that could be farmed has something concrete to check. Hunter has four
        # separate gates -- a transient-entity check, a player-created-golem check, a
        # player-attributed killing blow, and a spawn origin recorded on the mob itself. Cooking has
        # NONE of them, for one reason: an item has no spawn origin. A cooked steak is a cooked
        # steak whether you caught the cow yourself or a hopper fed it to a smoker while you slept.
        #
        # Vanilla's own cook times are 100 ticks smoking, 200 smelting, 600 campfire, so ONE smoker
        # is 720 items/hour unattended and eight are 5,760/hour. The furnace-owner map is filled by
        # a single right-click and held for the whole session, so that array keeps paying its owner
        # the entire time.
        #
        # 1200 is two continuously-running smokers. Against Cooking's XP curve that is roughly the
        # skill's intended ~100-hour pace, so it does not bite anyone cooking by hand or running a
        # normal kitchen -- it bites the array that runs forever.
        #
        # NOTE: it counts ITEMS, not crafts. XP is priced per item and multiplied by the batch, so a
        # cap counting crafting ACTIONS would let one shift-click of 64 cookies spend a single unit
        # of this budget while paying 64 items' worth of XP.
        #
        # Set to 0 to disable the cap entirely. Cooks past the cap still cook; they just pay nothing,
        # and you are told once per hour when that starts happening.
        Max_Cooks_Per_Hour: 1200
    COTWBreeding: true
    UnsafeEnchantments: false
    # Prevent many exploits related to fishing
    Fishing: true
    EndermanEndermiteFarms: true
    # Renamed from `Agility` on 2026-08-17 when that skill was retired. Same switch, same behaviour:
    # blocks self-inflicted damage from feeding the movement skills' fall/dodge XP.
    Movement: true
    LavaStoneAndCobbleFarming: true
    TreeFellerReducedXP: true
    PistonCheating: true
    SnowGolemExcavation: true
    PreventArmorStandInteraction: true
    PreventMannequinInteraction: true
    # PreventPluginNPCInteraction was removed here in the GitHub #9 pass. It guarded against NPCs
    # from Bukkit plugins such as Citizens -- a thing that cannot exist in a singleplayer Fabric
    # world, and whose detection helpers were dropped back in Phase 9. Leaving the key would have
    # offered a switch that changes nothing, which is the exact defect that pass went looking for.
    # This will limit XP gained from unnaturally tall plants, like those created by Bone Meal
    LimitTallPlantFarming: true
    # Blocks you place by hand give no gathering rewards when you mine them again.
    #
    # ######################################################################################
    # THIS IS THE SINGLE BIGGEST ANTI-FARM GATE IN THE MOD.
    # ######################################################################################
    # Without it, one stack of any valuable ore is infinite Mining XP: place it, mine it,
    # place it again. The same loop works for Woodcutting (logs), Excavation (sand/gravel)
    # and Herbalism. Every gathering skill in mcMMO is trivially maxed in an afternoon.
    #
    # The flags follow the world, not the session -- they are saved to
    # <world>/mcmmo/placed_blocks.dat, so a block you placed before a restart is still
    # ineligible after one. Only still-standing placed blocks are remembered; mining one
    # forgets it again, so the file stays small.
    #
    # NOTE: crops are NOT governed by this. Planting a seed places a block, so gating crops
    # on placed-ness would zero out Herbalism entirely. Crops pay on MATURITY instead, which
    # is their own anti-exploit and is unaffected by this setting.
    PlacedBlocks: true
    Stealth:
        # Require a live movement keypress for sneak XP, not merely a change in position.
        #
        # Sneak-distance is the most farmable XP source in the mod -- the wiki that suggested this
        # skill literally jokes "Sticky keys op". A taped-down shift key in a water current, on a
        # moving boat, or on a piston loop all change your position without you being at the
        # keyboard. This gate reads the player's actual input state server-side, so being CARRIED
        # earns nothing while walking under your own power earns normally.
        #
        # Leave this on. It exists as an escape hatch because if a client ever stops sending input
        # packets, the gate would silently reduce Stealth XP to zero rather than merely mis-tune it.
        Require_Movement_Input: true
    Unarmored:
        # Only pay Unarmored XP for damage dealt by a LIVING attacker (a mob or a player).
        #
        # This is the skill's single most important exploit gate. "XP for taking damage" is
        # otherwise farmed by standing in a cactus, a fire, a berry bush or a drowning pool with a
        # stack of food -- no mobs, no risk, no attention, and it works while you make a sandwich.
        # Requiring an attacker means the XP has to come from an actual fight, which is the thing
        # the skill exists to reward.
        #
        # The attacker also has to be someone OTHER than you. A player is a living entity, so
        # without that clause your own primed TNT -- and your own Blast Mining charge, which is a
        # repeatable mining loop that Demolitions Expertise exists to make survivable -- would count
        # as an attacker and pay full XP for blowing yourself up on purpose.
        #
        # Turning this off makes fall, fire, cactus, lava, drowning and suffocation damage all pay.
        # It is here so the behaviour is diagnosable during play-testing, not as a balance knob.
        Require_Living_Attacker: true

        # How many times ONE attacker can pay you Unarmored XP before it stops counting.
        # Set to 0 to disable the cap entirely.
        #
        # Require_Living_Attacker above closes the environmental farms but not the one that actually
        # matters, because a zombie IS a living attacker. One zombie hitting you through a slab,
        # while a stack of golden carrots regenerates the damage as fast as it lands, is a fully
        # passive ~250 XP/s -- that is level 1000 in about twelve hours, against a skill budgeted at
        # ninety-two. Only a per-attacker cap reaches it.
        #
        # Capping per attacker rather than per second is what keeps real fights intact. A hard fight
        # is a few hits from each of several mobs and never comes close to twenty; the farm is
        # thousands of hits from the SAME mob, and it stops paying at the twenty-first. Being hit
        # twenty times by one mob while wearing nothing is already a fight going badly.
        #
        # (Same mechanism as the Agility dodge cap, four times the size. The counter is transient --
        # it lives as long as the mob does and is not saved.)
        Max_Awards_Per_Attacker: 20
    Husbandry:
        # How long ONE animal must wait before it can pay a harvest award again, in seconds.
        # Set to 0 to disable the gate entirely.
        #
        # This covers MILKING and BRUSHING, and only those two, because they are the only harvest
        # verbs vanilla rate-limits by nothing whatsoever:
        #
        #   * Right-clicking a cow with a bucket is free and infinitely repeatable on the SAME cow.
        #     Unmitigated it would be the fastest XP in the whole mod.
        #   * Brushing an armadillo is the same. This one is worth spelling out because it LOOKS
        #     rate-limited and is not: brush/armadillo.json drops a scute with no conditions at all,
        #     and brushScute never reads or resets the armadillo's scute-shed timer -- that timer only
        #     governs the passive shed. There is no vanilla brush cooldown to lean on.
        #
        # Shearing and hive harvesting are deliberately EXEMPT. Vanilla already limits them, in
        # fiction and for free: a just-sheared sheep is worthless until it has eaten its way back to
        # a full coat, and a drained hive needs five levels of bee-pollination time. Adding a
        # stopwatch on top of a mechanic that already has one only makes the skill feel arbitrary.
        #
        # Five minutes matches vanilla's own post-breeding love cooldown, so the two clocks a player
        # has to keep in their head are the same clock.
        Harvest_Cooldown_Seconds: 300

        # How many breedings may pay Husbandry XP inside one window, and how long that window is.
        # Set either to 0 to disable the cap entirely.
        #
        # ######################################################################################
        # THIS IS HUSBANDRY'S ANTI-EXPLOIT GATE. It is not a flavour knob.
        # ######################################################################################
        # Husbandry pays XP per BREEDING, and Multi-Breed turns one player action into many
        # breedings, so something has to bound what a pen can produce.
        #
        # Until 2026-08-04 that gate lived in advanced.yml as
        # Skills.Husbandry.MultiBreed.MaxAdditionalAnimals -- a ceiling of four on how many animals
        # ONE breeding item could set in love. It was moved here (GitHub #3) because it was wrong
        # twice over:
        #
        #   * It taxed the mechanic instead of the reward. Multi-Breed exists so you can feed the
        #     pen from where you stand; a cap of four sent you walking to the rest of the herd
        #     anyway, which is exactly what the issue reports as painful.
        #   * IT NEVER BOUNDED THE XP RATE. It bounded XP per ITEM, and wheat is free. Twenty clicks
        #     in one breath set a hundred animals in love and paid all fifty resulting breedings, so
        #     the farm the cap was written against went straight through it.
        #
        # Counting PAYOUTS PER UNIT OF TIME closes that, because time is the one input a farm cannot
        # manufacture. Same shape as the Unarmored per-attacker cap and the Agility dodge cap above:
        # this port's answer to a repeatable award has consistently been a ceiling on the AWARD.
        #
        # The thirty seconds is DERIVED, not tuned -- it is vanilla's own love duration
        # (AnimalEntity#lovePlayer sets loveTicks = 600), so every breeding that one handful of feed
        # can possibly cause lands inside a single window. That is what makes the cap readable as
        # "one handful of feed pays at most eight breedings". Do NOT shorten the window to "make it
        # fairer": a window briefer than vanilla's love duration splits one click's burst across two
        # windows and silently doubles the effective cap.
        #
        # Eight is double the old four, per the issue. At the shipped cow price of 350 that is
        # 336,000 XP/h sustained, comfortably above the skill's ~51 h design budget -- so it does
        # not bite a player breeding by hand or working a normal pen, only the loop that repeats
        # forever.
        #
        # A refused breeding still happens and still produces its calf. It simply pays nothing --
        # and it leaves the calf UNMARKED, so the raise verb pays nothing for it either twenty
        # minutes later. Otherwise the cap would be a delay rather than a cap.
        Breed_Xp_Awards_Per_Window: 8
        Breed_Xp_Award_Window_Seconds: 30
Fishing_ExploitFix_Options:
    MoveRange: 3
    OverFishLimit: 10
Experience_Bars:
    # Turn this to false if you want to disable XP bars
    Enable: true
    # Seconds a skill's XP bar stays on screen after you stop gaining XP in it, then it fades.
    Hide_Delay_Seconds: 10
    # How many XP bars may be on screen at once. When a new skill's bar appears and this many are
    # already showing, the one you trained least recently is hidden to make room. Boss bars stack
    # downward over the hotbar, so an unbounded number of them eventually covers the screen —
    # sprinting through a forest while mining can easily have five skills live at once.
