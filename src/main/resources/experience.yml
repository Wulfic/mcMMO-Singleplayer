    Unarmored:
        # XP per point of damage TAKEN while every armour slot is empty. A point is half a heart, so
        # a 3-damage zombie punch pays 300 XP at the default.
        #
        # Three things shape this number, and none of them is obvious:
        #
        #  1. It is measured against the PRE-ARMOUR damage, before Iron Skin absorbs its share.
        #     Iron Skin is itself an armour bonus, so paying on what actually landed would make the
        #     skill throttle its own progress -- at the diamond tier roughly two thirds of every hit
        #     is soaked, so the longest stretch of the grind would crawl at a third rate. That reads
        #     to a player as a bug, not as a design.
        #
        #  2. A single hit is capped at 20 damage (one full health bar) before this multiplier, so a
        #     charged-creeper one-shot or a command-dealt 10,000 cannot pay a jackpot.
        #
        #  3. Taking damage is self-throttling in a way that mining or sneaking is not: vanilla
        #     invulnerability frames limit how often you can be hit, and you die at 20 HP. You cannot
        #     grind this one while making a sandwich.
        #
        # 100 XP/point needs 110,100 pre-armour damage for a RetroMode level-1000 skill. At a
        # sustained "lose a full health bar every minute and heal it back" that is roughly 92 hours
        # -- in the same band as Stealth's ~122h and movement-on-land's ~204h. MEASURE THIS IN §G; it is
        # a starting point, not a derived number.
        Damage_Taken: 100
