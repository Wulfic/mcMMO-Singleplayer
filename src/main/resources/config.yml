#
#  mcMMO configuration
#  Last updated on ${project.version}-b${BUILD_NUMBER}
#
#####

#
#  Settings for mcMMO in general
###
General:
    # NOTE: upstream's whole General.Level_Up_Chat_Broadcasts section was removed here (2026-08-06).
    # Every setting in it decided WHICH OTHER PLAYERS see your level-up -- party members only, same
    # world only, a broadcast radius in blocks. There are no other players in singleplayer, so no
    # value of any of those keys could ever change anything, and no toggle about them could be
    # honest. Nothing in the port ever read them; a ModMenu switch was writing Enabled to a key with
    # no getter at all. The level-up message you DO see is a private one and is controlled by
    # Feedback / NotificationManager, not by this.
    # Turning this on will scale mcMMO around 1-1000 with default scaling factor
    # Everything in your config related to skill level requirements, skill level bonuses, etc. will be multiplied by 10 when this mode is on
    # This change is purely cosmetic, it retains the old feel of mcMMO where you could level up thousands of times
    RetroMode:
        Enabled: true
    # Optional support for the client-side "Advancement Plaques" mod. When enabled, reaching a skill
    # milestone grants a hidden vanilla advancement, which Advancement Plaques renders as a custom
    # plaque. With no such mod installed you simply get a normal advancement toast instead. mcMMO does
    # not depend on the mod either way; set Enabled to false to switch milestone advancements off.
    Milestone_Advancements:
        Enabled: true
        # A "round level" plaque fires whenever a skill crosses a multiple of this number (e.g. 100 ->
        # plaques at 100, 200, 300...). Rank unlocks, power-level tiers and maxing a skill always fire
        # their own plaques regardless of this value.
        Level_Interval: 100
    Locale: en_US
    PowerLevel:
        Skill_Mastery:
            Enabled: true
    AprilFoolsEvent: true
    MOTD_Enabled: true
    EventBroadcasts: true
    EventInfoOnPlayerJoin: true
    AdminNotifications: true
    # Send a message to the player when his profile was successfully loaded
    Show_Profile_Loaded: false
    # Amount of time (in minutes) to wait between saves of player information
    Save_Interval: 10
    # Allow mcMMO to report on basic anonymous usage
    Stats_Tracking: true
    Power_Level_Cap: 0
    # Should mcMMO truncate levels if you lower your max level cap for a skillname
    TruncateSkills: true
    # Should mcMMO print out debug messages?
    Verbose_Logging: false
    # Should mcMMO over-write configs to update, or make new ones ending in .new?
    Config_Update_Overwrite: true
    # Play level-up sounds
    LevelUp_Sounds: true

    # This should fix blocks being broken client side, but not server-side.
    # Enable to refresh the chunks around a player at the end of Super Breaker,
    # Giga Drill Breaker, and Berserk. Resource intensive for larger servers.
    Refresh_Chunks: false

#
#  REMOVED (2026-08-06): Scoreboard, Mob_Healthbar, Database_Purging, Backups, MySQL, Hardcore,
#  Mods, Items and Party.
#
#  These nine sections -- roughly 180 keys -- configured features this port does not have. Most were
#  cut with multiplayer in Phase 1.5 (parties, the sidebar scoreboard, the MySQL backend, database
#  purging, config backups, mob healthbars above other players' targets). The rest never existed
#  here: Mods configured Bukkit custom-material files, Items configured the Chimaera Wing (a
#  multiplayer teleport item) and a Flux Pickaxe sound for Flux Mining, a sub-skill the port never
#  ported at all.
#
#  Not one of them had a reader. Shipping them meant the file the player opens documented features
#  they can never turn on -- the same "settings surface over a dead mechanic" defect the 2026-08-06
#  wiring audit was written to close, just spelled in YAML instead of in a ModMenu switch.
#
#  NOTE: deleting a key here does NOT remove it from a config that already exists on disk --
#  copyMissingDefaults only back-fills ABSENT keys, it never prunes. Existing worlds keep these
#  sections harmlessly (nothing reads them either way); only fresh worlds get the clean file.
###
#
#  Settings for Abilities
###
Abilities:
    Enabled: true
    Messages: true
    Activation:
        Only_Activate_When_Sneaking: false
        # Upstream mcMMO refuses to ready a tool while you are holding anything in your OFF hand
        # (unless you are sneaking or riding something). Readying is step 1 of 2, so that one rule
        # switches off every super ability at once, silently -- and a torch in the off hand is the
        # normal way to mine. This port therefore ships it OFF. Set it to true for upstream behaviour.
        Offhand_Blocks_Readying: false
    Cooldowns:
        Berserk: 240
        Blast_Mining: 60
        Giga_Drill_Breaker: 240
        Green_Terra: 240
        Herdsmans_Call: 240
        Second_Wind: 240
        Serrated_Strikes: 240
        Skull_Splitter: 240
        Smoke_Bomb: 240
        Super_Breaker: 240
        Tree_Feller: 240
    Max_Seconds:
        Berserk: 0
        Blast_Mining: 0
        Giga_Drill_Breaker: 0
        Green_Terra: 0
        Herdsmans_Call: 0
        Second_Wind: 0
        Serrated_Strikes: 0
        Skull_Splitter: 0
        Smoke_Bomb: 0
        Super_Breaker: 0
        Tree_Feller: 0
    Limits:
        Tree_Feller_Threshold: 1000
    Tools:
        # Use more tool durability while using abilities. Set Durability_Loss to 0 to disable the extra durability damage.
        Durability_Loss: 1

#
#  Settings for Skills
#  Level cap of 0 for no limit
###
Skills:
    Agility:
        Enabled_For_PVP: true
        Enabled_For_PVE: true
        # Prevent earning movement XP a few seconds after teleporting. Applies to all three domains.
        XP_After_Teleport_Cooldown: 5
        # Agility is a CHILD skill: it earns no XP itself, and its level is the mean of Parkour,
        # Swimming and Flying -- so Agility 1000 needs 1000 in all three (1000 Flying on its own is
        # Agility 333). Capping it here caps what its sub-skills can reach.
        #
        # It keeps exactly the two sub-skills that span more than one medium, Fleet Footed and Second
        # Wind, because the mean of three is only an honest gate for a perk that works in all three.
        # Everything single-medium moved to that medium's own skill on 2026-08-10.
        Level_Cap: 0
        # Item that triggers the Second Wind super ability on right-click. Never consumed.
        Second_Wind_Item: FEATHER
    # The three movement domains that feed Agility. Each one now owns the perks specific to it:
    # Parkour has Dodge, Roll, Athlete, Smash and Snow Walker; Swimming has Lead Lungs and Lake
    # Raider; Flying has Glide and Solar Wings. Their tuning lives in advanced.yml and skillranks.yml.
    Parkour:
        Level_Cap: 0
        # Dodge is a Parkour sub-skill as of 2026-08-10 (it was Skills.Agility.Prevent_Dodge_Lightning).
        Prevent_Dodge_Lightning: false
    Swimming:
        Level_Cap: 0
    Flying:
        Level_Cap: 0
    Alchemy:
        # Allow Hoppers to transfer ingredients and brew Rank 1 Alchemy potions
        Enabled_for_Hoppers: true
        # Prevent Hoppers from transferring ingredients into Brewing Stands
        Prevent_Hopper_Transfer_Ingredients: false
        # Prevent Hoppers from transferring bottles into Brewing Stands
        Prevent_Hopper_Transfer_Bottles: false
        Level_Cap: 0
    Archery:
        Enabled_For_PVP: true
        Enabled_For_PVE: true
        Level_Cap: 0
    Axes:
        Enabled_For_PVP: true
        Enabled_For_PVE: true
        Level_Cap: 0
    # Cooking is a processing skill, not a gathering one: it pays for turning food into better food
    # in a furnace, smoker, blast furnace, campfire or crafting grid. Its boundary against Smelting
    # is the input -- ore pays Smelting, food pays Cooking, and neither pays both.
    Cooking:
        Level_Cap: 0
        # POWER COOK -- the food you cooked grants its effect when you eat it.
        #
        # Key   = the food item (the same Config_String form used by Experience_Values and
        #         Bonus_Drops, so the whole skill reads one way through this file).
        # Value = the status effect it grants. Registry name, or a legacy Bukkit alias.
        #
        # THE AMPLIFIER IS ALWAYS 0 AND IS NOT CONFIGURABLE. The duration comes from
        # advanced.yml -> Skills.Cooking.PowerCook.Seconds_Per_Rank (3s at rank 1, 15s at rank 5).
        # A brewed Strength potion is 3:00 at amplifier 1 -- twelve times longer before the
        # amplifier is counted -- and that gap is the entire reason Cooking does not delete Alchemy.
        #
        # ⚠️⚠️ NEVER MAP AN EFFECT THAT FIRES EVERY TICK. Saturation, Instant Health, Instant
        # Damage, Hunger, Absorption, Bad Omen and Raid Omen all apply once PER TICK for their whole
        # duration, so 3 seconds of Saturation is +60 food onto a 20-point bar -- one slice of bread
        # would end hunger as a resource forever. An effect's NAME does not tell you its cadence;
        # only StatusEffect#canApplyUpdateEffect does, and a test walks every row of this section
        # and asserts it. Four of those seven are NOT InstantStatusEffect subclasses, so "it is not
        # an instant potion" is not the check.
        #
        # ⚠️ Cooked/crafted foods only -- an apple you picked off a tree grants nothing. Foods that
        # already carry a vanilla effect (golden apple, pufferfish, rotten flesh, spider eye,
        # poisonous potato, chorus fruit, honey bottle, raw chicken, enchanted golden apple) are
        # deliberately absent: stacking on top of vanilla's own effect is not worth the code.
        #
        # ⚠️ Fire Resistance and Water Breathing are banned outright, at any duration. 15 seconds of
        # either is a lava-lake shortcut and a monument shortcut, and both are Alchemy's to sell.
        #
        # Delete a row to disable it. An unknown effect name disables the row and logs once.
        Power_Cook_Effects:
            Cooked_Beef: STRENGTH
            Cooked_Porkchop: RESISTANCE
            Cooked_Mutton: RESISTANCE
            Cooked_Chicken: SPEED
            Cooked_Rabbit: JUMP_BOOST
            # ⚠️ Dolphin's Grace, NOT Water Breathing -- see the ban above.
            Cooked_Cod: DOLPHINS_GRACE
            Cooked_Salmon: DOLPHINS_GRACE
            Baked_Potato: HASTE
            Dried_Kelp: HASTE
            # ⚠️ Bread was Saturation in an earlier draft. It is the traveller's loaf now; see the
            # every-tick warning above for why that row could never have shipped.
            Bread: SPEED
            Cookie: SPEED
            Pumpkin_Pie: REGENERATION
            Mushroom_Stew: REGENERATION
            Beetroot_Soup: REGENERATION
            Rabbit_Stew: JUMP_BOOST
    Excavation:
        Level_Cap: 0
    Fishing:
        Level_Cap: 0
        Drops_Enabled: true
        Override_Vanilla_Treasures: true
        # Always catch fish, even when treasure is found
        Extra_Fish: false
        Lure_Modifier: 4.0
    Herbalism:
        Level_Cap: 0
        Prevent_AFK_Leveling: true
    Hunter:
        Level_Cap: 0
        # Hunter is a combat skill, so it carries the PVP/PVE switches -- but note what they gate. They
        # decide whether the skill TRIGGERS against that class of target, and Hunter's whole subject is
        # the target's identity. Turning Enabled_For_PVP off therefore does not merely mute a bonus: it
        # means player kills stop feeding the skill at all, which is the right answer for a
        # singleplayer port and is stated here so nobody reads it as an oversight later.
        Enabled_For_PVP: true
        Enabled_For_PVE: true
    Husbandry:
        Level_Cap: 0
        # Item that triggers the Herdsman's Call super ability on right-click. Never consumed.
        #
        # Must differ from Agility's Second_Wind_Item (FEATHER) and Stealth's Smoke_Bomb_Item
        # (GUNPOWDER): all three actives listen on the same use-item event, so a shared item would
        # activate one of them and print another's refusal, which looks like a broken ability rather
        # than a config collision.
        #
        # GOAT_HORN on purpose. It is thematic -- you blow the horn and the herd comes -- and mcMMO
        # only observes the click, so the horn still sounds as vanilla intends. It also has a real
        # acquisition cost (a goat has to ram a block for you), which suits an ability unlocked at
        # Husbandry 100. Any breeding item would have been a poor choice here: feeding animals is the
        # skill's core loop, and overloading that click invites confusion.
        Herdsmans_Call_Item: GOAT_HORN
    Mining:
        Level_Cap: 0
        Detonator_Name: FLINT_AND_STEEL
    Repair:
        Level_Cap: 0
        Anvil_Messages: true
        Anvil_Placed_Sounds: true
        Anvil_Use_Sounds: true
        Anvil_Material: IRON_BLOCK
        Use_Enchanted_Materials: false
        # Ask for a confirmation when a player tries to repair an enchanted item
        Confirm_Required: true
    Salvage:
        Level_Cap: 0
        Anvil_Messages: true
        Anvil_Placed_Sounds: true
        Anvil_Use_Sounds: true
        Anvil_Material: GOLD_BLOCK
        # Ask for a confirmation when a player tries to salvage an enchanted item
        Confirm_Required: true
    Smelting:
        Level_Cap: 0
    Stealth:
        Level_Cap: 0
        # Item that triggers the Smoke Bomb super ability on right-click. Never consumed.
        # Must differ from Agility's Second_Wind_Item: both actives listen on the same use-item
        # event, so sharing an item would fire one and print the other's refusal message.
        Smoke_Bomb_Item: GUNPOWDER
    Swords:
        Enabled_For_PVP: true
        Enabled_For_PVE: true
        Level_Cap: 0
    Tridents:
        Enabled_For_PVP: true
        Enabled_For_PVE: true
        Level_Cap: 0
    Crossbows:
        Enabled_For_PVP: true
        Enabled_For_PVE: true
        Level_Cap: 0
    Maces:
        Enabled_For_PVP: true
        Enabled_For_PVE: true
        Level_Cap: 0
    Spears:
        Enabled_For_PVP: true
        Enabled_For_PVE: true
        Level_Cap: 0
    Taming:
        Enabled_For_PVP: true
        Enabled_For_PVE: true
        Level_Cap: 0
        # Bring tamed pets along when you make a long jump inside the same world -- an ender pearl, a
        # /tp, a chorus fruit, a respawn. This is a deliberate override of vanilla, not a port fix.
        #
        # Vanilla already means to do this: a wolf's follow goal teleports it to you from ANY distance
        # once you are 12+ blocks away. What breaks is that the wolf stops being ticked the moment it
        # falls outside your simulation distance, so a long jump leaves it dormant and it never runs
        # the goal at all. Setting this to false restores that vanilla behaviour exactly.
        #
        # Cross-world moves are deliberately NOT covered (issue scope). A sitting, leashed or ridden
        # pet is never moved -- "sit" is an explicit order to stay, and honouring it is the point.
        Pets_Follow_Teleport: true
        # How far from where you left a pet may be and still be brought along, in blocks. Not
        # unbounded on purpose: whether a distant chunk happens to be loaded is not something a player
        # can see or predict, so a huge radius would make the feature work intermittently rather than
        # more often. A pet you deliberately left at a base is excluded by being SAT, not by distance.
        # Raised from 32 to 128 (GitHub #12): a pet trailing its owner during a sprint or an elytra
        # flight is routinely further than 32 blocks back at the moment the owner teleports, and 128
        # covers the whole band in which a pet was still being ticked (vanilla simulation distance).
        Pets_Follow_Teleport_Radius: 128
        Pet_Combat_Mode:
            # Your pets have a combat stance, and it belongs to YOU rather than to any one pet:
            #   PASSIVE (the default) -- a pet fights only what you fight.
            #   AGGRESSIVE            -- idle pets pick the nearest hostile to you and go for it.
            # Sneak and right-click any pet you own while holding the Toggle_Item to flip it. The pet
            # you click is only proving it is yours; the stance changes for ALL of your pets.
            #
            # Turning this off disables the gesture, the aggressive sweep and the engage-range boost
            # below, restoring vanilla pathing exactly.
            Enabled: true
            # What you must be holding to toggle the stance. While this is in your main hand,
            # sneak-right-clicking a pet changes the stance INSTEAD of sitting it -- a plain
            # right-click, or any other item, still sits it as usual.
            # Must differ from Second_Wind_Item, Smoke_Bomb_Item and Herdsmans_Call_Item.
            Toggle_Item: BONE
            # How far from YOU (not from each pet) an aggressive-mode pet looks for a fight, in
            # blocks. Measured from the player so the whole pack shares one search and a pet that
            # lagged behind cannot drag something home from somewhere you have never been.
            Aggressive_Radius: 32
            # How far a pet will CHASE a target it already has, in blocks. This is the fix for "my
            # pets ignore what I shoot": a wolf's natural follow range is 16, and past that it simply
            # cannot work out a path, so it stands still next to you with a target it will never walk
            # to. A melee kill happens at about 3 blocks; a bow kill at 20-40. The weapon was never
            # the problem -- the reach was.
            #
            # Raise this with care. Path-search cost grows with the CUBE of this number, it applies
            # per pet and per repath, and values above 64 are capped (with a warning in the log).
            # It applies in both stances, and only while a pet actually has a target.
            Engage_Range: 32
            # Server ticks between aggressive-mode sweeps. 20 is one second, which is well inside
            # what a player notices; lowering it buys nothing and costs a box query every tick.
            Sweep_Interval_Ticks: 20
        Call_Of_The_Wild:
            # Item_Material: Material of the item needed to summon the pet
            # Item_Amount: Amount of items required to summon the pet
            # Summon_Amount: Amount of pets to summon when using Call Of The Wild
            # Summon_Length: Pets despawn when their summon life length expires
            # Summon_Max_Amount: Maximum amount of pets that can be summoned at the same time
            Wolf:
                Item_Material: BONE
                Item_Amount: 10
                Summon_Amount: 1
                Summon_Length: 240
                Per_Player_Limit: 2
            Ocelot:
                Item_Material: COD
                Item_Amount: 10
                Summon_Amount: 1
                Summon_Length: 240
                Per_Player_Limit: 1
            Horse:
                Item_Material: APPLE
                Item_Amount: 10
                Summon_Amount: 1
                Summon_Length: 240
                Per_Player_Limit: 1
    Unarmed:
        Enabled_For_PVP: true
        Enabled_For_PVE: true
        Level_Cap: 0
        Block_Cracker:
            Allow_Block_Cracker: true
        # When using Unarmed, picked up items will automatically get moved to a free slot instead of going in the slot
        # of your hand. Should item pickup be disabled when your entire inventory - except for your hand - is full?
        Item_Pickup_Disabled_Full_Inventory: true
        # Any attacks made without a tool, i.e. with one's open hand, a block, etc., will count as unarmed.
        Items_As_Unarmed: false
    Unarmored:
        Level_Cap: 0
    Woodcutting:
        Tree_Feller_Sounds: true
        Level_Cap: 0

