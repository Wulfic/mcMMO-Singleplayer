# Build tuning. Measured on a 16-thread / 32 GB box, 2026-08-05 — see the notes per line.
# Daemon heap: 2G was the old value. Loom holds the remapped MC jar + mappings in memory; 4G
# removes the GC pressure without starving the forked test JVMs (test { maxHeapSize } is separate).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
# Single-module project, so this does nothing on its own today, but it is free and correct.
org.gradle.parallel=true
# Reuse task outputs across `clean` and branch switches, not just up-to-date checks.
org.gradle.caching=true
# Skips the ~5.8s startup+configuration phase on every subsequent build. Verified against
# fabric-loom 1.17.13 on 2026-08-05 (see below) — if a future Loom bump breaks it, the build fails
# loudly with a configuration-cache report rather than silently misbehaving.
org.gradle.configuration-cache=true

# Fabric toolchain — this band's pins verified against meta.fabricmc.net / modrinth on 2026-08-19.
# yarn 1.21.1+build.3 is the newest build for 1.21.1 (meta.fabricmc.net), and it matches the
# mappings Loom already had cached. loader_version is MC-independent and is deliberately NOT
# changed from master's. See CONVERSION_TODO.md Phase 0 and TODO.md 8.3.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.3
fabric_version=0.116.15+1.21.1

# Every Minecraft version THIS BRANCH'S BAND covers, ascending, comma-separated. One jar serves the
# whole band (ruling R-a), so this is not the same fact as `minecraft_version` above: that one pins
# what we COMPILE against, this one states what the built jar RUNS on.
#
# ⚠️ This value is PER-BAND and must never be copied when back-porting. The build.gradle logic that
# reads it back-ports; the value itself is re-derived on each branch. (Same trap as the generated
# MC-surface manifest — the generator travels, the generated fact does not.)
#
# It is deliberately redundant with `depends.minecraft` in fabric.mod.json, which is the half the
# LOADER enforces. BandVersionLabelTest proves the two agree, in both directions, using Fabric's own
# VersionPredicate engine — so the redundancy is checked rather than trusted.
supported_minecraft_versions=1.21,1.21.1

# Config backend
snakeyaml_version=2.3

# Optional client integrations (dev classpath only; never bundled). ModMenu surfaces the in-game
# config screen; Cloth Config builds the editable options UI. One artifact of each covers this
# band's whole range: ModMenu 11.0.4 and Cloth Config 15.0.140 both list 1.21 AND 1.21.1.
# ModMenu 11.0.4 (maven.terraformersmc.com); Cloth Config 15.0.140 (maven.shedaniel.me) -- the
# property is the bare maven version of `cloth-config-fabric`, so no `+fabric` suffix here.
modmenu_version=11.0.4
cloth_config_version=15.0.140

# Test toolchain
junit_version=5.11.4
# Mockito 5 mocks final classes out of the box (inline mock maker is the 5.x default), so the
# platform/ adapters (final wrappers over net.minecraft types) can be mocked in MC-free unit tests.
mockito_version=5.14.2

# Mod metadata
#
# THIS FORK'S OWN VERSION LINE. It restarted at 1.0.0 on 2026-08-18 (ruling R-s) and is unrelated to
# upstream mcMMO's Bukkit plugin, whose numbering this used to borrow (`2.2.050`). Nothing about the
# two release cadences is comparable, so sharing a number only invited the reader to compare them.
#
# Two properties of the FORM are load-bearing, not stylistic:
#   * Plain, UNPADDED semver. Fabric's parser normalises a padded patch -- `Version.parse("2.2.050")`
#     reports `2.2.50` -- so the jar filename said `2.2.050+mc...` while ModMenu said `2.2.50+mc...`.
#     `1.0.0` round-trips, and the two finally agree. Do not zero-pad a segment to make it sort.
#   * `-SNAPSHOT` on the branch; `release.yml` strips it and releases the bare version. That strip is
#     the ONLY permitted difference between this value and the one a release builds with, and
#     BandVersionLabelTest fails on any other.
#
# WARNING: BUMP THIS BEFORE A RELEASE. `release.yml` tags `mc<MCVER>-v<version>`, so shipping without
# a bump used to silently REPLACE that band's release and re-point a tag every clone had already
# fetched. Since ruling R-t that is a hard CI failure rather than a silent one -- the run refuses to
# publish a version that already shipped a different commit, and tells you to bump. TODO.md Phase 13.
#
# WARNING: this value is NOT per-band -- it back-ports like any other fix and is identical on every
# branch (R-p). Only `minecraft_version` and `supported_minecraft_versions` above are per-band. The
# bands are kept apart by the `mc<MCVER>-v` prefix on the TAG, not by this number.
mod_version=1.1.0-SNAPSHOT
maven_group=com.gmail.nossr50
archives_base_name=mcmmo
