# Build tuning. Measured on a 16-thread / 32 GB box, 2026-08-05 — see the notes per line.
# Daemon heap: 2G was the old value. Loom holds the remapped MC jar + mappings in memory; 4G
# removes the GC pressure without starving the forked test JVMs (test { maxHeapSize } is separate).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
# Single-module project, so this does nothing on its own today, but it is free and correct.
org.gradle.parallel=true
# Reuse task outputs across `clean` and branch switches, not just up-to-date checks.
org.gradle.caching=true
# Skips the ~5.8s startup+configuration phase on every subsequent build. Verified against
# fabric-loom 1.17.13 on 2026-08-05 (see below) — if a future Loom bump breaks it, the build fails
# loudly with a configuration-cache report rather than silently misbehaving.
org.gradle.configuration-cache=true

# Fabric toolchain — BAND BRANCH mc/1.21.5 (covers MC 1.21.5 only; it is a one-version band).
#
# ⚠️⚠️ THIS PIN IS THE BRANCH'S REASON TO EXIST. The invariant: NO TWO BRANCHES MAY RESOLVE TO
# THE SAME minecraft_version. master is 1.21.11; if this file ever says 1.21.11 again, this
# branch and master both claim the mc1.21.11-v* release line. Under ruling R-g master no longer
# runs release.yml, so today that collision is DORMANT rather than fixed -- it returns the day
# any release automation does, and this branch DOES still run release.yml. Never resolve a merge
# conflict here by taking master's side.
#
# yarn build numbers are NOT derivable from the MC version (1.21.5 is build.1 while 1.21.4 is
# build.8). Verified against meta.fabricmc.net on 2026-08-12.
#
# fabric-api / ModMenu / Cloth Config resolved against the Modrinth API on 2026-08-12, filtered
# to game_versions=[1.21.5] + loaders=[fabric] -- never extrapolated from master's numbers.
# ModMenu 14.x is the line that advertises 1.21.5; 15.x starts at 1.21.6, which is this band's
# upper boundary arrived at independently of our own probe.
minecraft_version=1.21.5
yarn_mappings=1.21.5+build.1
loader_version=0.19.3
fabric_version=0.128.2+1.21.5

# Config backend
snakeyaml_version=2.3

# Optional client integrations (dev classpath only; never bundled). ModMenu surfaces the in-game
# config screen; Cloth Config builds the editable options UI. Both versions target MC 1.21.5.
# ModMenu 14.0.2 (maven.terraformersmc.com); Cloth Config 18.0.145 (maven.shedaniel.me).
modmenu_version=14.0.2
cloth_config_version=18.0.145

# Test toolchain
junit_version=5.11.4
# Mockito 5 mocks final classes out of the box (inline mock maker is the 5.x default), so the
# platform/ adapters (final wrappers over net.minecraft types) can be mocked in MC-free unit tests.
mockito_version=5.14.2

# Mod metadata
mod_version=2.2.050-SNAPSHOT
maven_group=com.gmail.nossr50
archives_base_name=mcmmo
